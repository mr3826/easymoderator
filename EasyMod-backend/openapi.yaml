openapi: 3.1.0
info:
  title: EasyMod API
  version: 1.0.0
  description: EasyMod Backend API
servers:
  - url: /api
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Shop
  - name: Category
  - name: Product
  - name: Customer
  - name: Order
  - name: Payment
  - name: Channel
  - name: Dashboard
  - name: Conversation
  - name: RAG
  - name: Audit
  - name: Integration:Meta
  - name: Delivery
  - name: Subscription
  - name: Partner
  - name: Webhooks
  - name: CustomerIntelligence
  - name: OrderConfidence
  - name: Admin
paths:
  /category/:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Category]
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Category]
      summary: Create category
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /category/{id}:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Category]
      summary: Get category by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Category }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Category]
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Category]
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      parameters:
        - $ref: '#/components/parameters/RateLimitInfo'
      responses:
        '200':
          description: Service is alive
        '503':
          description: Service unavailable
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe with DB check
      security: []
      parameters:
        - $ref: '#/components/parameters/RateLimitInfo'
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
  /health/health:
    get:
      tags: [Health]
      summary: Full health details
      security: []
      responses:
        '200':
          description: Health info
        '503':
          description: Degraded

  /auth/signup:
    post:
      tags: [Auth]
      summary: User registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: user@example.com
              password: StrongPassw0rd!
              name: Jane Doe
            schema:
              type: object
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/Error' }
  /auth/signin:
    post:
      tags: [Auth]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: user@example.com
              password: StrongPassw0rd!
            schema:
              type: object
      responses:
        '200':
          description: JWT tokens
          content:
            application/json:
              example:
                accessToken: eyJhbGciOi...
                refreshToken: eyJhbGciOi...
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              refreshToken: eyJhbGciOi...
            schema:
              type: object
      responses:
        '200': { description: New access token }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shop/list:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Shop]
      summary: List shops for current user
      responses:
        '200':
          description: List of shops
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Shop' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/me:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Shop]
      summary: Get current shop context
      responses:
        '200': { description: Shop }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/create:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Create shop
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Demo Shop
              address: 123 Main St
              phone: "+1-555-0100"
            schema:
              type: object
      responses:
        '201': { description: Shop created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/update:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Update shop
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
              name: Demo Shop v2
            schema:
              type: object
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/delete:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Delete shop
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
            schema:
              type: object
      responses:
        '200': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/add-user:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Add user to shop
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
              user_email: invitee@example.com
              role: manager
            schema:
              type: object
      responses:
        '200': { description: Added }
  /shop/remove-user:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Remove user from shop
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
              user_id: user_456
            schema:
              type: object
      responses:
        '200': { description: Removed }
  /shop/update-role:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Update user role
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
              user_id: user_456
              role: admin
            schema:
              type: object
      responses:
        '200': { description: Updated }
  /shop/switch:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Switch active shop
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
            schema:
              type: object
      responses:
        '200': { description: Switched }

  /category:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Category]
      summary: List categories
      responses:
        '200': { description: Categories }
    post:
      tags: [Category]
      summary: Create category
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Shoes
              parent_id: null
            schema:
              type: object
      responses:
        '201': { description: Created }

  /category/list:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Category]
      summary: Legacy list categories
      responses:
        '200': { description: Categories }
  /category/get:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Category]
      summary: Legacy get category (validation pending)
      responses:
        '200': { description: Category }
  /category/create:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Category]
      summary: Legacy create category
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              name: Shoes
            schema:
              type: object
      responses:
        '201': { description: Created }
  /category/update:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Category]
      summary: Legacy update category (validation pending)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              id: cat_123
              name: Boots
            schema:
              type: object
      responses:
        '200': { description: Updated }
  /category/delete:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Category]
      summary: Legacy delete category (validation pending)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              id: cat_123
            schema:
              type: object
      responses:
        '200': { description: Deleted }

  /product:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Product]
      summary: List products
      responses:
        '200': { description: Products }
    post:
      tags: [Product]
      summary: Create product
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-usage-impact: products +1 after commit
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Running Shoe
              sku: SKU-123
              price: 59.99
              stock: 50
              category_id: cat_123
            schema:
              type: object
      responses:
        '201': { description: Created }

  /product/{id}:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Product]
      summary: Get product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product }
    patch:
      tags: [Product]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              price: 64.99
            schema:
              type: object
      responses:
        '200': { description: Updated }
    delete:
      tags: [Product]
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Deleted }

  /product/list:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Product]
      summary: Legacy list products
      responses:
        '200': { description: Products }
  /product/get:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Product]
      summary: Legacy get product
      responses:
        '200': { description: Product }
  /product/create:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Product]
      summary: Legacy create product
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-usage-impact: products +1 after commit
      requestBody:
        content:
          application/json:
            example:
              name: Running Shoe
              price: 59.99
            schema:
              type: object
      responses:
        '201': { description: Created }
  /product/update:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Product]
      summary: Legacy update product
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              id: prod_123
              price: 64.99
            schema:
              type: object
      responses:
        '200': { description: Updated }
  /product/delete:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Product]
      summary: Legacy delete product
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              id: prod_123
            schema:
              type: object
      responses:
        '200': { description: Deleted }

  /customer:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Customer]
      summary: List customers
      responses:
        '200': { description: Customers }
    post:
      tags: [Customer]
      summary: Create customer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Alice
              email: alice@example.com
              phone: "+1-555-0101"
            schema:
              type: object
      responses:
        '201': { description: Created }

  /customer/{id}:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Customer]
      summary: Get customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Customer }
    patch:
      tags: [Customer]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              phone: "+1-555-0102"
            schema:
              type: object
      responses:
        '200': { description: Updated }
    delete:
      tags: [Customer]
      summary: Delete customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Deleted }

  /customer/list:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Customer]
      summary: Legacy list customers
      responses:
        '200': { description: Customers }
  /customer/get:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Customer]
      summary: Legacy get customer
      responses:
        '200': { description: Customer }
  /customer/create:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Customer]
      summary: Legacy create customer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              name: Alice
              email: alice@example.com
            schema:
              type: object
      responses:
        '201': { description: Created }
  /customer/update:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Customer]
      summary: Legacy update customer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              id: cust_123
              phone: "+1-555-0102"
            schema:
              type: object
      responses:
        '200': { description: Updated }

  /order:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Order]
      summary: List orders
      responses:
        '200': { description: Orders }
    post:
      tags: [Order]
      summary: Create order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-usage-impact: orders +1 after commit
      requestBody:
        required: true
        content:
          application/json:
            example:
              customer_id: cust_123
              items:
                - product_id: prod_123
                  quantity: 2
                  price: 49.99
              status: draft
            schema:
              type: object
      responses:
        '201': { description: Created }

  /order/{id}:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Order]
      summary: Get order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Order }
    patch:
      tags: [Order]
      summary: Update order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              status: confirmed
            schema:
              type: object
      responses:
        '200': { description: Updated }
    delete:
      tags: [Order]
      summary: Delete order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Deleted }

  /order/list:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Order]
      summary: Legacy list orders
      responses:
        '200': { description: Orders }
  /order/get:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Order]
      summary: Legacy get order
      responses:
        '200': { description: Order }
  /order/create:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Order]
      summary: Legacy create order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-usage-impact: orders +1 after commit
      requestBody:
        content:
          application/json:
            example:
              customer_id: cust_123
              items:
                - product_id: prod_123
                  quantity: 1
                  price: 49.99
            schema:
              type: object
      responses:
        '201': { description: Created }
  /order/update:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Order]
      summary: Legacy update order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              id: ord_123
              status: shipped
            schema:
              type: object
      responses:
        '200': { description: Updated }
  /order/delete:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Order]
      summary: Legacy delete order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              id: ord_123
            schema:
              type: object
      responses:
        '200': { description: Deleted }
  /order/draft:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Order]
      summary: Create draft order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-usage-impact: orders +1 after commit
      requestBody:
        content:
          application/json:
            example:
              customer_id: cust_123
              items:
                - product_id: prod_123
                  quantity: 1
                  price: 49.99
            schema:
              type: object
      responses:
        '201': { description: Draft created }
  /order/confirm:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Order]
      summary: Confirm order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              order_id: ord_123
            schema:
              type: object
      responses:
        '200': { description: Confirmed }

  /payment/config:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Payment]
      summary: Get payment configuration
      responses:
        '200': { description: Payment configs }
    post:
      tags: [Payment]
      summary: Save payment configuration
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              gateway: aamarpay
              credentials:
                store_id: abc
                signature_key: secret
              active: true
            schema:
              type: object
      responses:
        '200': { description: Saved }
  /payment/initiate:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Payment]
      summary: Initiate payment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              order_id: ord_123
              amount: 99.99
              gateway: aamarpay
            schema:
              type: object
      responses:
