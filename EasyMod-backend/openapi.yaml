  /commercial/contract:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Subscription]
      summary: Authenticated commercial contract and merchant claim allowlist
      responses:
        '200':
          description: Frozen contract, hashes and merchant claim descriptors
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [contractVersion, contractHash, registryHash, contract, claims]
                    properties:
                      contractVersion: { type: string }
                      contractHash: { type: string }
                      registryHash: { type: string }
                      contract: { $ref: '#/components/schemas/CommercialContract' }
                      claims:
                        type: array
                        items: { $ref: '#/components/schemas/ClaimDescriptor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Shop context required }

  /commercial/claims:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Subscription]
      summary: Server-evaluated claim decisions for a surface
      parameters:
        - name: surface
          in: query
          required: true
          schema:
            type: string
            enum: [pricing, subscription, signup, landing, email, usage-banner, mobile, collateral, growth-os, admin, invoice]
        - name: locale
          in: query
          required: false
          schema: { type: string, enum: [en, bn], default: bn }
      responses:
        '200':
          description: Claim decisions (fail-closed)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [surface, locale, contractVersion, registryHash, decisions]
                    properties:
                      surface: { type: string }
                      locale: { type: string, enum: [en, bn] }
                      contractVersion: { type: string }
                      registryHash: { type: string }
                      decisions:
                        type: array
                        items: { $ref: '#/components/schemas/ClaimDecision' }
        '400': { description: Unknown claim surface }
        '401': { $ref: '#/components/responses/Unauthorized' }

