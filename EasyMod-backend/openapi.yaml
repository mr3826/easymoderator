        '403': { description: Invalid signature }
        '500': { description: Processing error }

  # ── Pilot intelligence (docs/pilot-intelligence/04-api.md) ────────────────
  # Tenant is always the JWT shopId; every route requires an active shop
  # membership. Customer routes answer 409 FEATURE_DISABLED unless the shop
  # has the customer_intelligence pilot flag.
  /customer-intelligence/status:
    get:
      tags: [CustomerIntelligence]
      summary: Pilot feature state for the current shop (always answers)
      responses:
        '200':
          description: Flags
          content:
            application/json:
              example: { success: true, data: { customer_intelligence: true, order_confidence_mode: shadow } }
  /customer-intelligence/customers:
    get:
      tags: [CustomerIntelligence]
      summary: Customer 360 list (computed state, order counts, delivered value, open opportunity)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Name or phone }
        - { name: view, in: query, schema: { type: string, enum: [all, opportunities], default: all } }
      responses:
        '200': { description: 'Flat body { success, data[], total, page, pageSize }' }
        '409': { description: FEATURE_DISABLED }
  /customer-intelligence/customers/{customerId}:
    get:
      tags: [CustomerIntelligence]
      summary: Customer 360 detail (identity, summary, state, orders, timeline, opportunities, RTO signal)
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Detail }
        '400': { description: VALIDATION_ERROR }
        '404': { description: Not found in this shop }
  /customer-intelligence/opportunities:
    get:
      tags: [CustomerIntelligence]
      summary: Sales opportunities
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [LIVE, OPEN, ACTIONED, CONVERTED, DISMISSED, EXPIRED], default: LIVE } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: 'Flat body { success, data[], total, page, pageSize }' }
  /customer-intelligence/opportunities/summary:
    get:
      tags: [CustomerIntelligence]
      summary: Detected / converted / dismissed / expired counts and median times
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 180, default: 30 } }
      responses:
        '200': { description: Summary }
  /customer-intelligence/opportunities/{opportunityId}/contacted:
    post:
      tags: [CustomerIntelligence]
      summary: Mark an OPEN opportunity as contacted (audited)
      parameters:
        - { name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: Opportunity (status ACTIONED) }
        '404': { description: Not found in this shop }
        '409': { description: OPPORTUNITY_STATE_CONFLICT }
  /customer-intelligence/opportunities/{opportunityId}/dismiss:
    post:
      tags: [CustomerIntelligence]
      summary: Dismiss a live opportunity with a reason (audited)
      parameters:
        - { name: opportunityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [NOT_INTERESTED, ALREADY_HANDLED, NOT_A_REAL_REQUEST, OTHER] }
      responses:
        '200': { description: Opportunity (status DISMISSED) }
        '404': { description: Not found in this shop }
        '409': { description: OPPORTUNITY_STATE_CONFLICT }
  /order-confidence/orders/{orderId}:
    get:
      tags: [OrderConfidence]
      summary: Current RTO Shield v2 decision for an order (re-evaluated from current facts)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Decision, or { mode: off, decision: null } when the shop has no pilot' }
        '404': { description: Not found in this shop }
  /order-confidence/orders/{orderId}/verify:
    post:
      tags: [OrderConfidence]
      summary: Record that a VERIFY order was confirmed with the customer (any shop role; audited)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision_version, method]
              properties:
                decision_version: { type: integer, minimum: 1 }
                method: { type: string, enum: [PHONE_CALL, CHAT, IN_PERSON, OTHER] }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: Updated decision }
        '409': { description: 'DECISION_CHANGED | APPROVAL_REQUIRED | NO_RESOLUTION_REQUIRED | ORDER_NOT_BOOKABLE | FEATURE_DISABLED; error.details.decision carries the current decision' }
  /order-confidence/orders/{orderId}/approve:
    post:
      tags: [OrderConfidence]
      summary: Owner/admin approval of a MANUAL_REVIEW order (audited override)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision_version, note]
              properties:
                decision_version: { type: integer, minimum: 1 }
                note: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Updated decision }
        '403': { description: Not an owner or admin }
        '409': { description: 'DECISION_CHANGED | NO_RESOLUTION_REQUIRED | ORDER_NOT_BOOKABLE | FEATURE_DISABLED' }
  /order-confidence/summary:
    get:
      tags: [OrderConfidence]
      summary: Decisions and delivery outcomes by released decision (owner/admin)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 180, default: 30 } }
      responses:
        '200': { description: Summary }
        '403': { description: Not an owner or admin }
  /order/{orderId}/book-courier:
    post:
      tags: [Order]
      summary: Book a courier for an order (canonical booking boundary)
      description: >-
        For shops with order_confidence_mode=enforce, answers 409
        ORDER_CONFIDENCE_HOLD (or ORDER_CONFIDENCE_UNAVAILABLE) with
        { decision, reasons, decision_version } until the order is verified or
        approved. No courier claim is created and the provider is not called.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Booked }
        '409': { description: 'COURIER_SETUP_REQUIRED | COURIER_DISPATCH_INDETERMINATE | ORDER_CONFIDENCE_HOLD | ORDER_CONFIDENCE_UNAVAILABLE' }
        '502': { description: COURIER_BOOKING_FAILED }
  /admin/shops/{shopId}/pilot-features:
    get:
      tags: [Admin]
      summary: Read a shop's pilot flags (platform admin)
      parameters:
        - { name: shopId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Flags }
    patch:
      tags: [Admin]
      summary: Set a shop's pilot flags (SUPER_ADMIN; audited)
      parameters:
        - { name: shopId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                customer_intelligence: { type: boolean }
                order_confidence_mode: { type: string, enum: ['off', shadow, enforce] }
                order_confidence_config:
                  type: object
                  properties:
                    high_value_cod_threshold: { type: integer, minimum: 0, maximum: 1000000 }
                    address_min_length: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { description: Flags }
        '403': { description: Not SUPER_ADMIN }
  /admin/pilot-features/disable-all:
    post:
      tags: [Admin]
      summary: Global kill switch — every shop back to pre-pilot behaviour (SUPER_ADMIN; audited)
      responses:
        '200': { description: '{ affected }' }
        '403': { description: Not SUPER_ADMIN }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XShopId:
      name: x-shop-id
      in: header
      required: false
      schema:
        type: string
      description: Shop identifier for multi-tenant context
    RateLimitInfo:
      name: x-rate-limit-info
      in: header
      required: false
      schema:
        type: string
      description: Rate limit information header
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: false
      schema:
        type: string
      description: Idempotency key for safe retries
  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: AUTH_ERROR
                  message:
                    type: string
                    example: Invalid or missing token
          examples:
            unauthorized:
              value:
                success: false
                error:
                  code: AUTH_ERROR
                  message: Invalid or missing token
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
    Error:
      description: General error response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Invalid request payload
  schemas:
    Shop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        phone:
          type: string
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
        shop_id:
          type: string
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parent_id:
          type: string
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        parent_id:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        stock:
          type: integer
        category_id:
          type: string
    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        total:
          type: number
        delivered_at:
          type: string
          format: date-time
          nullable: true
        customer_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      properties:
        product_id:
          type: string
        quantity:
          type: integer
        price:
          type: number
    PaymentConfig:
      type: object
      properties:
        gateway:
          type: string
          enum: [aamarpay, sslcommerz, cod]
        active:
          type: boolean
        credentials:
          type: object
    Subscription:
      description: >
        Merchant subscription envelope (ADR-0011). The contract is the price
        authority; the row carries the single MERCHANT delivered-order billing
        state. Retired fields (effective_conversation_limit,
        conversation_quota_exhausted, partner_eligibility, extra_usage) are gone.
      type: object
      required: [subscription, plan, contract, contract_version, usage, period]
      properties:
        subscription:
          type: object
          properties:
            id: { type: string, format: uuid }
            shop_id: { type: string, format: uuid }
            plan_code: { type: string, enum: [MERCHANT] }
            plan_name: { type: string }
            plan_price: { type: number, description: Always 0. No subscription fee. }
            billing_cycle: { type: string, enum: [monthly] }
            billing_model: { type: string, enum: [per_order] }
            per_order_charge_bdt: { type: number, description: Derived from the commercial contract. }
            status: { type: string }
            current_period_start: { type: string, format: date-time }
            current_period_end: { type: string, format: date-time }
            next_billing_date: { type: string, format: date-time }
        plan:
          type: object
          required: [code, name, billing_model]
          properties:
            code: { type: string, enum: [MERCHANT] }
            name: { type: string }
            billing_model: { type: string, enum: [per_order] }
        contract: { $ref: '#/components/schemas/CommercialContract' }
        contract_version: { type: string }
        contract_hash: { type: string }
        usage:
          type: object
          properties:
            conversations: { $ref: '#/components/schemas/UsageMetric' }
            orders: { $ref: '#/components/schemas/UsageMetric' }
            products: { $ref: '#/components/schemas/UsageMetric' }
        period:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
    CommercialContract:
      type: object
      required: [contractVersion, model, currency, unitPriceMinor, dueDays]
      properties:
        contractVersion: { type: string }
        schemaName: { type: string }
        model: { type: string, enum: [DELIVERED_ORDER] }
        currency: { type: string, enum: [BDT] }
        trigger: { type: string, enum: [ORDER_DELIVERED_PROVIDER_CONFIRMED] }
        unitPriceMinor: { type: integer, description: Integer poisha per delivered order. }
        zeroRatedOutcomes:
          type: array
          items: { type: string }
        subscriptionFeeMinor: { type: integer, enum: [0] }
        setupFeeMinor: { type: integer, enum: [0] }
        monthlyMinimumMinor: { type: integer, enum: [0] }
        conversationEntitlement: { type: object, nullable: true, enum: [null] }
        cycle: { type: string, enum: [MONTHLY] }
        payment: { type: string, enum: [POSTPAID] }
        dueDays: { type: integer }
        onOverdue:
          type: object
          properties:
            blockCourierBooking: { type: boolean }
            pauseAutomatedAi: { type: boolean }
            keepInboxReadable: { type: boolean }
            keepHistoryReadable: { type: boolean }
            deleteData: { type: boolean, enum: [false] }
    PublicCommercialContract:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [contract_version, contract_hash, model, currency, unit_price_minor, due_days]
          properties:
            contract_version: { type: string }
            contract_hash: { type: string }
            model: { type: string, enum: [DELIVERED_ORDER] }
            currency: { type: string, enum: [BDT] }
            trigger: { type: string }
            unit_price_bdt: { type: number }
            unit_price_minor: { type: integer }
            zero_rated_outcomes:
              type: array
              items: { type: string }
            subscription_fee_bdt: { type: number, enum: [0] }
            setup_fee_bdt: { type: number, enum: [0] }
            monthly_minimum_bdt: { type: number, enum: [0] }
            conversation_entitlement: { type: object, nullable: true }
            cycle: { type: string }
            payment: { type: string }
            due_days: { type: integer }
            description:
              type: object
              properties:
                en: { type: string }
                bn: { type: string }
    ClaimDescriptor:
      type: object
      required: [id, verifiedScope, surfaces, i18nKey]
      properties:
        id: { type: string }
        verifiedScope: { type: string, nullable: true }
        surfaces:
          type: array
          items: { type: string }
        i18nKey:
          type: object
          properties:
            en: { type: string }
            bn: { type: string }
        fallbackI18nKey:
          type: object
          nullable: true
          properties:
            en: { type: string }
            bn: { type: string }
    ClaimDecision:
      type: object
      required: [claimId, available, render, locale, surface, mode, contractVersion, registryHash]
      properties:
        claimId: { type: string }
        available: { type: boolean }
        render: { type: string, enum: [claim, fallback, none] }
        textKey: { type: string, nullable: true }
        locale: { type: string, enum: [en, bn] }
        surface: { type: string }
        scope:
          type: object
          properties:
            claimedProviders: { type: array, items: { type: string }, nullable: true }
            verifiedProviders: { type: array, items: { type: string }, nullable: true }
            match: { type: boolean }
            text: { type: string, nullable: true }
        interpolation: { type: object }
        mode: { type: string, enum: [off, shadow, enforce] }
        predicate: { type: object }
        wouldBlock: { type: boolean }
        contractVersion: { type: string }
        registryHash: { type: string }
    BillingLine:
      description: One terminal commercial outcome for one order. Integer poisha.
      type: object
      required: [id, invoiceId, orderId, lineKind, outcome, unitPriceMinor, amountMinor, currency, contractVersion]
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid, nullable: true }
        orderId: { type: string, format: uuid }
        lineKind: { type: string, enum: [billable, zero_rated] }
        outcome: { type: string, enum: [DELIVERED, RETURNED, CANCELLED] }
        unitPriceMinor: { type: integer }
        amountMinor: { type: integer, description: 0 for explicit zero-rated outcomes. }
        currency: { type: string, enum: [BDT] }
        contractVersion: { type: string }
        createdAt: { type: string, format: date-time }
    RetiredCatalog:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, enum: [CATALOG_RETIRED] }
        message: { type: string }
        successor: { type: string }
    UsageMetric:
      type: object
      properties:
        used: { type: integer }
        limit: { type: integer, description: -1 means unlimited. }
        percentage: { type: number }
        status: { type: string, enum: [safe, warning, exceeded] }
    Invoice:
      type: object
      properties:
        id:
          type: string
        invoice_number:
          type: string
        billing_period:
          type: string
        amount:
          type: number
        payment_id:
          type: string
        metadata:
          type: object
        status:
          type: string
        due_date:
          type: string
          format: date-time
    Channel:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
        status:
          type: string
        metadata:
          type: object
    Conversation:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        status:
          type: string
        channel:
          type: string
    Message:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        sender:
          type: string
        content:
          type: string
        sent_at:
          type: string
          format: date-time
