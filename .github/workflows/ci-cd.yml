name: CI / CD

# ──────────────────────────────────────────────────────────────────────────────
# Pull requests exercise the protected test gate. Trusted main/manual release
# runs enter through release.yml and reuse this reviewed graph; publish and
# deploy jobs remain guarded by event, branch, and repository gates.
# Required GitHub secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST          — Droplet IP or hostname (update after each droplet swap)
#   DO_SSH_PRIVATE_KEY   — SSH private key with root access to the droplet
#   DO_SSH_KNOWN_HOSTS   — pinned SSH host keys for DEPLOY_HOST
# Public origin settings are repository variables, not secrets:
#   VITE_API_BASE_URL    — https://api.easymod.tech
#   VITE_APP_URL         — https://app.easymod.tech
#   VITE_MARKETING_URL   — https://easymod.tech
#   VITE_META_APP_ID     — Meta App ID (public, used for OAuth popup)
#   VITE_SENTRY_DSN      — Sentry DSN (optional)
#   TELEGRAM_BOT_TOKEN   — optional; required only when TELEGRAM_ENABLED=true
#   TELEGRAM_BOT_USERNAME — optional; bot username without @
#   TELEGRAM_WEBHOOK_SECRET — optional; required only when Telegram is enabled
#   REDX_WEBHOOK_SECRET  — required for RedX delivery webhook verification
#   API_URL / BASE_URL   — https://api.easymod.tech (API + public uploads)
#   BODY_SIZE_LIMIT      — 35mb (Messenger attachment upload payloads)
#   PRODUCT_IMAGE_QUOTA_BYTES — 104857600 (per-shop product-image cap)
#
# The droplet must have:
#   /opt/easymod/docker-compose.prod.yml  (committed to repo, synced by deploy)
#   /opt/easymod/Caddyfile                (committed to repo, synced by deploy)
#   /opt/easymod/.env.prod                (manually placed, never committed)
# ──────────────────────────────────────────────────────────────────────────────

on:
  # Run the test gate on PRs into main so breakage is caught BEFORE it lands.
  # Publish/deploy runs are entered through release.yml and are guarded to never
  # run on pull_request (see those jobs).
  pull_request:
    branches: [main]
  # Keep the implementation in one reviewed graph while giving release.yml a
  # separate, trusted main/manual entrypoint. The caller supplies only operator
  # inputs; secrets are inherited by the trusted caller, never by pull requests.
  workflow_call:
    inputs:
      target:
        required: false
        type: string
        default: ''
      before_sha:
        required: false
        type: string
        default: ''
      wipe_db_first:
        required: false
        type: string
        default: ''
      seed_admin:
        required: false
        type: string
        default: ''
      deploy_confirmation:
        required: false
        type: string
        default: ''
      existing_backend_digest:
        required: false
        type: string
        default: ''
      existing_candidate_sha:
        required: false
        type: string
        default: ''
      growth_image_override:
        required: false
        type: string
        default: ''
      expect_schema_drift:
        required: false
        type: string
        default: ''
      trace_from:
        required: false
        type: string
        default: ''
      trace_to:
        required: false
        type: string
        default: ''
      trace_marker:
        required: false
        type: string
        default: EASYMOD_AFTER_DONE
  workflow_dispatch:
    inputs:
      target:
        description: 'Which service to deploy'
        required: false
        default: 'all'
        type: choice
        options: [all, backend, frontend, probe]
      wipe_db_first:
        description: 'DESTRUCTIVE — wipe easymod DB before deploy. Type WIPE to confirm (anything else = no-op).'
        required: false
        default: ''
        type: string
      seed_admin:
        description: 'Seed/update the SEED_ADMIN_* production review account. Type SEED to confirm.'
        required: false
        default: ''
        type: string
      deploy_confirmation:
        description: 'One-shot production confirmation. Type DEPLOY-<full main SHA>.'
        required: false
        default: ''
        type: string
      existing_backend_digest:
        description: 'Previously built backend sha256 digest to deploy after a separate recovery gate.'
        required: false
        default: ''
        type: string
      existing_candidate_sha:
        description: 'Full main SHA that produced existing_backend_digest.'
        required: false
        default: ''
        type: string
      growth_image_override:
        description: 'Optional sha256 digest published by growth-os.yml for this commit; when set, the deploy job swaps growth-frontend to that image rather than carrying the running container forward.'
        required: false
        default: ''
        type: string
      expect_schema_drift:
        description: 'One-shot: require the 3 repair columns ABSENT before migrating. Type DRIFT to confirm.'
        required: false
        default: ''
        type: string
      trace_from:
        description: 'Read-only inbound trace window start (ISO UTC); used only with target=probe.'
        required: false
        default: ''
        type: string
      trace_to:
        description: 'Read-only inbound trace window end (ISO UTC); used only with target=probe.'
        required: false
        default: ''
        type: string
      # trace_marker is available through workflow_call. Direct dispatch uses
      # the same stable default to keep workflow_dispatch under GitHub's limit.

concurrency:
  group: ci-cd-${{ github.ref }}
  # A cancelled main run can contain cumulative changes that a later one-commit
  # path diff cannot see. Serialize production-capable runs, but cancel stale PR
  # validation because pull_request jobs can never publish or deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Required by the dorny/paths-filter step in the `changes` job: on
  # pull_request events it reads the PR's changed files via the GitHub API.
  # Without this the `changes` job fails and the whole PR gate skips.
  pull-requests: read

env:
  GHCR_BACKEND: ghcr.io/${{ github.repository_owner }}/easymoderator-backend
  GHCR_FRONTEND: ghcr.io/${{ github.repository_owner }}/easymoderator-frontend
  # Published by growth-os.yml, consumed here only so Compose can resolve the
  # growth-frontend service to a digest during deploy and rollback.
  GHCR_GROWTH: ghcr.io/${{ github.repository_owner }}/easymoderator-growth-os

jobs:
  # ── 1. Detect which services changed ────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: none
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' }}
      growth: ${{ steps.filter.outputs.growth == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed service paths locally
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target || '' }}
          BEFORE_SHA: ${{ inputs.before_sha || github.event.before || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false
          # Growth OS has its own workflow and its own deploy. This flag only
          # decides whether the PR gate calls that workflow for verification;
          # growth-os.yml still owns push/deploy on its own trigger.
          growth=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" || ( "$EVENT_NAME" == "workflow_call" && -n "$TARGET" ) ]]; then
            [[ "$TARGET" == "all" || "$TARGET" == "backend" ]] && backend=true
            [[ "$TARGET" == "all" || "$TARGET" == "frontend" ]] && frontend=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              changed_paths="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            else
              changed_paths="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
            fi

            # Only this workflow gates these two services. Matching
            # .github/workflows/* rebuilt and redeployed both on every unrelated
            # workflow edit — backup.yml, growth-os.yml, security-scan.yml.
            while IFS= read -r path; do
              case "$path" in
                EasyMod-backend/*|docker-compose.prod.yml|docker-compose.test.yml|scripts/run-backend-integration.js|scripts/rollback-rehearsal.sh|package.json|package-lock.json|.github/workflows/ci-cd.yml|.github/workflows/grant-growth-role.yml|.github/workflows/seed-initial-growth-admin.yml|.github/workflows/grant-platform-admin.yml)
                  backend=true
                  ;;
              esac
              case "$path" in
                EasyMod-frontend/*|Caddyfile|package.json|package-lock.json|.github/workflows/ci-cd.yml)
                  frontend=true
                  ;;
              esac
              # Any backend change can affect a server-backed Growth OS
              # contract, so the reusable Growth verification must run too.
              case "$path" in
                EasyMod-growth/*|EasyMod-extension/*|EasyMod-backend/*|scripts/run-growth-e2e.js|Caddyfile|docker-compose.prod.yml|docker-compose.test.yml|package.json|package-lock.json|.github/workflows/growth-os.yml|.github/workflows/ci-cd.yml|.github/workflows/grant-growth-role.yml|.github/workflows/seed-initial-growth-admin.yml)
                  growth=true
                  ;;
              esac
            done <<< "$changed_paths"
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "growth=$growth" >> "$GITHUB_OUTPUT"

  # ── 2. Test gate — must pass before any image is built or deployed ──────────
  # This is the gate that makes the silent-failure bug class (job-not-enqueued /
  # sent:false) impossible to ship "green": backend unit tests run here, and the
  # build/deploy jobs below are blocked unless this job succeeds.
  test:
    name: Quality fast (affected backend/frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      # Backend unit tests (Jest). The curated suite in jest.config.js is green;
      # a failing unit test fails this job and blocks the deploy.
      - name: Backend — install & test
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        run: |
          npm ci
          npm run test:security
          npm test

      # Proof/calibration helpers live at the monorepo root because they are
      # copied into isolated proof containers and must not bootstrap the app.
      - name: Qdrant proof and semantic calibration helper tests
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        run: >-
          npx jest --config jest.config.js --rootDir .. --roots scripts
          --runTestsByPath ../scripts/__tests__/qdrant-migration-proof.test.js
          ../scripts/__tests__/qdrant-restore-readiness.test.js
          ../scripts/__tests__/semantic-calibration.test.js
          ../scripts/__tests__/semantic-acceptance-contract.test.js --runInBand

      # Frontend production build — TypeScript/import errors fail here, before a
      # broken bundle can be shipped.
      - name: Frontend — install & build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: ./EasyMod-frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.easymod.tech' }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://app.easymod.tech' }}
          VITE_MARKETING_URL: ${{ vars.VITE_MARKETING_URL || 'https://easymod.tech' }}
          VITE_META_APP_ID: ${{ vars.VITE_META_APP_ID || '2040799330176198' }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_ENV: production

      # Frontend unit tests (Vitest) are a blocking launch gate.
      - name: Frontend — unit tests
        if: needs.changes.outputs.frontend == 'true'
        working-directory: ./EasyMod-frontend
        run: npm run test:unit

  # ── 2a. Frontend browser proof — mock-only business reply-mode contract ─────
  # The Playwright config starts Vite on port 4273. This tier deliberately does
  # not require the backend, PostgreSQL, Redis, Meta, or any live provider.
  frontend-e2e:
    name: EasyModerator frontend Playwright (mock-only)
    # Pinned: Playwright 1.58.2 cannot install Chromium on ubuntu-26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: EasyMod-frontend/package-lock.json

      - name: Frontend — install dependencies
        working-directory: ./EasyMod-frontend
        run: npm ci

      - name: Install Chromium
        working-directory: ./EasyMod-frontend
        run: npm exec --offline -- playwright install --with-deps chromium

      - name: Run mock-only frontend browser proof
        working-directory: ./EasyMod-frontend
        env:
          PLAYWRIGHT_PORT: '4273'
        run: npm run test:e2e -- tests/e2e/ai-reply-mode.spec.ts tests/e2e/channel-automation.spec.ts tests/e2e/shared-inbox.spec.ts tests/e2e/signup-terms.spec.ts tests/e2e/meta-oauth-contract.spec.ts tests/e2e/customer-intelligence.spec.ts tests/e2e/order-management.spec.ts --workers=1

      - name: Run V7 public funnel browser proof (synthetic API only)
        working-directory: ./EasyMod-frontend
        run: npm run test:e2e:public

      - name: Run truth-gate commercial claims browser proof
        working-directory: ./EasyMod-frontend
        run: npm run test:e2e:truth-gate

      - name: Upload frontend Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: easymod-frontend-playwright-${{ github.run_id }}
          path: |
            EasyMod-frontend/playwright-report/
            EasyMod-frontend/test-results/
          if-no-files-found: ignore

      - name: Upload V7 public-funnel screenshots
        if: always() && needs.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v7-public-funnel-screenshots-${{ github.run_id }}
          path: EasyMod-frontend/test-results/v7-public-funnel/*.png
          if-no-files-found: ignore
          retention-days: 30

  # ── 2b. Meta-shaped E2E — the AI trust boundary, asserted at the send ───────
  # Enters through the REAL signed Meta webhook route and runs the real queue,
  # worker, retrieval, grounding gate and Meta provider; only the Graph API
  # transport and the LLM transport are captured (tests/meta-e2e/transport.js).
  # No Meta credential is involved: the suite signs its payloads with an
  # isolated test App Secret. The REAL-Meta smoke test is deliberately NOT here
  # — it needs a human to send the first Messenger message and access to the
  # deployed stores. See docs/testing/META_E2E_TEST_SETUP.md §11.
  meta-e2e:
    name: Meta-shaped E2E (AI trust boundary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # Same condition as `test` so the deploy graph stays simple; the heavy steps
    # below are skipped when only the frontend changed.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: none
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: easymod_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.backend == 'true'
        with:
          node-version: '20'

      - name: Backend — install
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        run: npm ci

      # test:meta:e2e, not test:integration. Those two were the same command
      # while test:integration was an alias for jest.meta-e2e.config.js; now
      # that it points at the real integration suite, calling it here ran the
      # wrong tests against this job's database.
      - name: Meta-shaped E2E suite
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_e2e
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:meta:e2e

  # ── 2c. Non-deploy deployment contract dry run ─────────────────────────────
  # This job validates Compose interpolation plus the repository's production
  # secret-backed renderer. It never opens SSH or changes the droplet.
  deployment-config:
    name: Deployment configuration dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test, meta-e2e]
    if: |
      always() &&
      (
        ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.target == 'probe') ||
        (
          needs.changes.result == 'success' &&
          needs.test.result == 'success' &&
          needs.meta-e2e.result == 'success' &&
          (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        )
      ) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Validate renderer syntax and production contract tests
        working-directory: ./EasyMod-backend
        run: |
          npm ci
          node --check scripts/render-production-env.js
          node --check scripts/validate-rollback-contract.js
          npx jest scripts/__tests__/render-production-env.test.js --runInBand
          node scripts/validate-rollback-contract.js

      - name: Execute disposable rollback rehearsal
        run: bash scripts/rollback-rehearsal.sh

      - name: Upload rollback rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-rehearsal-evidence
          path: _tmp/rollback-rehearsal-report.json
          if-no-files-found: error

      - name: Validate production Compose without SSH or production values
        env:
          GHCR_IMAGE_BACKEND: ghcr.io/mr3826/easymoderator-backend:dry-run
          GHCR_IMAGE_FRONTEND: ghcr.io/mr3826/easymoderator-frontend:dry-run
          GHCR_IMAGE_GROWTH: ghcr.io/mr3826/easymoderator-growth-os:dry-run
        run: |
          mkdir -p _tmp
          cat > _tmp/.env.prod <<'EOF'
          DB_USER=e2e
          DB_PASSWORD=synthetic-dry-run-password
          DB_NAME=easymod_dry_run
          ACME_EMAIL=ops@example.com
          EOF
          cp _tmp/.env.prod .env.prod
          trap 'rm -f .env.prod' EXIT
          docker compose --env-file _tmp/.env.prod -f docker-compose.prod.yml config --quiet

      - name: Validate production secret and deployment contracts without SSH
        # Never expose repository secrets to forked pull requests; the
        # synthetic contract step above remains the PR-safe validation.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          DELIVERY_ENCRYPTION_KEY: ${{ secrets.DELIVERY_ENCRYPTION_KEY }}
          REDX_WEBHOOK_SECRET: ${{ secrets.REDX_WEBHOOK_SECRET }}
          CHANNEL_ENCRYPTION_KEY: ${{ secrets.CHANNEL_ENCRYPTION_KEY }}
          CHANNEL_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.CHANNEL_ENCRYPTION_KEY_PREVIOUS }}
          REDIS_QUEUE_DB: ${{ secrets.REDIS_QUEUE_DB }}
          PAYMENT_CALLBACK_HMAC_SECRET: ${{ secrets.PAYMENT_CALLBACK_HMAC_SECRET }}
          AI_ACTION_GATE_SECRET: ${{ secrets.AI_ACTION_GATE_SECRET }}
          MARKETING_URL: ${{ vars.MARKETING_URL || 'https://easymod.tech' }}
          APP_URL: ${{ vars.APP_URL || 'https://app.easymod.tech' }}
          API_URL: ${{ vars.API_URL || 'https://api.easymod.tech' }}
          PUBLIC_ASSET_URL: ${{ vars.PUBLIC_ASSET_URL || 'https://api.easymod.tech' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://app.easymod.tech,https://growth.easymod.tech' }}
          FRONTEND_URL: ${{ vars.APP_URL || 'https://app.easymod.tech' }}
          BASE_URL: ${{ vars.API_URL || 'https://api.easymod.tech' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_ASSET_URL || 'https://api.easymod.tech' }}
          LEGACY_COOKIE_DOMAIN: ${{ vars.LEGACY_COOKIE_DOMAIN || 'easymod.tech' }}
          META_OAUTH_REDIRECT_URI: ${{ vars.META_OAUTH_REDIRECT_URI || 'https://app.easymod.tech/channels/oauth-callback' }}
          META_APP_ID: ${{ vars.VITE_META_APP_ID || '2040799330176198' }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Facebook Login for Business configuration ID. Public, not a secret,
          # so it lives in a repository variable like META_OAUTH_REDIRECT_URI.
          # Deliberately NOT defaulted in-workflow: an unset variable must fail
          # the production config validation rather than deploy a login dialog
          # pointed at somebody else's configuration.
          META_LOGIN_CONFIG_ID: ${{ vars.META_LOGIN_CONFIG_ID }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          # The canary is disabled on normal releases. A manual, protected
          # activation requires the exact protected repository-variable phrase
          # and complete canary configuration; the renderer validates the rest.
          META_DISCOVERY_CANARY_ENABLED: ${{ vars.META_DISCOVERY_CANARY_CONFIRMATION == 'ENABLE-META-DISCOVERY-CANARY' && vars.META_DISCOVERY_CANARY_ENABLED == 'true' && 'true' || 'false' }}
          META_DISCOVERY_CANARY_SHOP_ID: ${{ vars.META_DISCOVERY_CANARY_CONFIRMATION == 'ENABLE-META-DISCOVERY-CANARY' && vars.META_DISCOVERY_CANARY_SHOP_ID || '' }}
          META_DISCOVERY_CANARY_PAGE_ID: ${{ vars.META_DISCOVERY_CANARY_CONFIRMATION == 'ENABLE-META-DISCOVERY-CANARY' && vars.META_DISCOVERY_CANARY_PAGE_ID || '' }}
          META_DISCOVERY_CANARY_EXPIRES_AT: ${{ vars.META_DISCOVERY_CANARY_CONFIRMATION == 'ENABLE-META-DISCOVERY-CANARY' && vars.META_DISCOVERY_CANARY_EXPIRES_AT || '' }}
          META_USER_PROFILE_ENABLED: ${{ vars.META_USER_PROFILE_ENABLED || 'false' }}
          GROWTH_OS_ENABLED: ${{ vars.GROWTH_OS_ENABLED || 'false' }}
          # Mobile API switch (ADR M-010). Operator-owned repository variable:
          # exactly "true" or "false", anything else fails the render.
          # Rollback: set it to "false" and redeploy
          # (docs/deployment/MOBILE_API_ACTIVATION_RUNBOOK.md).
          MOBILE_API_ENABLED: ${{ vars.MOBILE_API_ENABLED || 'false' }}
          BKASH_ENABLED: ${{ vars.BKASH_ENABLED || 'false' }}
          BKASH_BASE_URL: ${{ secrets.BKASH_BASE_URL }}
          BKASH_USERNAME: ${{ secrets.BKASH_USERNAME }}
          BKASH_PASSWORD: ${{ secrets.BKASH_PASSWORD }}
          BKASH_APP_KEY: ${{ secrets.BKASH_APP_KEY }}
          BKASH_APP_SECRET: ${{ secrets.BKASH_APP_SECRET }}
          BKASH_WEBHOOK_SECRET: ${{ secrets.BKASH_WEBHOOK_SECRET }}
          BKASH_SANDBOX: "false"
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          # Customer-photo matching is opt-in; renderer defaults to false.
          AI_PHOTO_MATCH_ENABLED: ${{ vars.AI_PHOTO_MATCH_ENABLED || 'false' }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          QDRANT_VECTOR_SIZE: ${{ vars.QDRANT_VECTOR_SIZE || '384' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Caddy ACME contact (repository variable — an email address is not a
          # secret, but it must never be committed; render fails without it).
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          ALLOW_SELF_SIGNED_TLS: ${{ secrets.ALLOW_SELF_SIGNED_TLS }}
          BODY_SIZE_LIMIT: ${{ secrets.BODY_SIZE_LIMIT || '35mb' }}
          PRODUCT_IMAGE_QUOTA_BYTES: ${{ vars.PRODUCT_IMAGE_QUOTA_BYTES || '104857600' }}
          MEDIA_FETCH_ALLOWED_HOSTS: ${{ secrets.MEDIA_FETCH_ALLOWED_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
          PROBE_MODE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.target == 'probe' }}
          SCHEMA_DRIFT_MODE: ${{ inputs.expect_schema_drift == 'DRIFT' }}
          PROBE_INBOUND_TRACE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.target == 'probe' && inputs.trace_from != '' && inputs.trace_to != '' }}
          TRACE_FROM: ${{ inputs.trace_from }}
          TRACE_TO: ${{ inputs.trace_to }}
          TRACE_MARKER: ${{ inputs.trace_marker || 'EASYMOD_AFTER_DONE' }}
        run: |
          set -euo pipefail
          mkdir -p _tmp
          trap 'rm -f _tmp/.env.prod.real' EXIT
          schema_probe_mode='basic'
          if [ "$SCHEMA_DRIFT_MODE" = "true" ]; then
            schema_probe_mode='pre-migration'
          fi
           test -n "$DEPLOY_HOST"
           test -n "$DO_SSH_PRIVATE_KEY"
           test -n "$DO_SSH_KNOWN_HOSTS"
           if [ "$PROBE_INBOUND_TRACE" = "true" ]; then
             case "$TRACE_FROM$TRACE_TO$TRACE_MARKER" in *$'\n'*|*$'\r'*)
               echo 'trace inputs must not contain newlines' >&2
               exit 1
             esac
             [[ "$TRACE_FROM" =~ ^[0-9T:Z+.-]+$ ]]
             [[ "$TRACE_TO" =~ ^[0-9T:Z+.-]+$ ]]
             [[ "$TRACE_MARKER" =~ ^[A-Za-z0-9_.:-]{5,200}$ ]]
           fi
           node EasyMod-backend/scripts/render-production-env.js _tmp/.env.prod.real
          test -s _tmp/.env.prod.real
          grep -q '^CSRF_SECRET=' _tmp/.env.prod.real
          grep -q '^PAYMENT_CALLBACK_HMAC_SECRET=' _tmp/.env.prod.real
          grep -q '^QDRANT_URL=' _tmp/.env.prod.real
          grep -q '^QDRANT_COLLECTION=' _tmp/.env.prod.real
          grep -q '^QDRANT_API_KEY=' _tmp/.env.prod.real
          grep -q '^SLACK_ALERT_WEBHOOK_URL=' _tmp/.env.prod.real
          echo 'secret-backed-render=PASS'

          # META_APP_ID and META_APP_SECRET must belong to the SAME Meta app.
          # The public app ID comes from the repository variable while the
          # secret remains masked, so nothing but this check stops one drifting
          # to a different app than the other -- which silently retargets the
          # consent dialog and 403s every webhook. Graph rejects a mismatched
          # client_id/client_secret pair, so one client_credentials call is a
          # complete test. Never print either value.
          meta_id=$(grep -m1 '^META_APP_ID=' _tmp/.env.prod.real | cut -d= -f2-)
          meta_secret=$(grep -m1 '^META_APP_SECRET=' _tmp/.env.prod.real | cut -d= -f2-)
          test -n "$meta_id"
          test -n "$meta_secret"
          pair_url='https://graph.facebook.com/v21.0/oauth/access_token?grant_type=client_credentials'
          if ! curl -sf --get "$pair_url" --data-urlencode "client_id=$meta_id" --data-urlencode "client_secret=$meta_secret" | grep -q access_token; then
            echo "META_APP_ID ($meta_id) and META_APP_SECRET are not a valid pair for one Meta app." >&2
          echo "Fix the VITE_META_APP_ID repository variable / META_APP_SECRET secret before deploying." >&2
            exit 1
          fi
          echo "meta-app-credential-pair=PASS (app $meta_id)"
          if [ "$PROBE_MODE" = "true" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null

            probe_env_path="/opt/easymod/.env.prod.candidate.${GITHUB_RUN_ID}"
            probe_script_path="/opt/easymod/production-db-auth-probe.${GITHUB_RUN_ID}.js"
            cleanup_probe() {
              ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
                "rm -f -- '$probe_env_path' '$probe_script_path'" >/dev/null 2>&1 || true
              rm -f _tmp/.env.prod.real
            }
            trap cleanup_probe EXIT

            scp -i ~/.ssh/deploy_key _tmp/.env.prod.real \
              root@"$DEPLOY_HOST":"$probe_env_path"
            scp -i ~/.ssh/deploy_key EasyMod-backend/scripts/production-db-auth-probe.js \
              root@"$DEPLOY_HOST":"$probe_script_path"
            trace_from_arg=$(printf '%q' "$TRACE_FROM")
            trace_to_arg=$(printf '%q' "$TRACE_TO")
            trace_marker_arg=$(printf '%q' "$TRACE_MARKER")
            ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
              'set -e
               echo PRODUCTION_POSTGRES_ENV
               docker exec easymod-postgres-1 printenv | awk -F= '\''$1=="POSTGRES_DB" || $1=="POSTGRES_USER" {print $1"="$2}'\''
               echo PRODUCTION_POSTGRES_DATABASES
               if ! docker exec easymod-postgres-1 psql -U postgres -Atc "\l" 2>/dev/null; then
                 docker exec easymod-postgres-1 sh -c "PGPASSWORD=\"\$POSTGRES_PASSWORD\" psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"\\l\""
               fi'
            ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
              "set -e; chmod 600 '$probe_env_path'; chmod 644 '$probe_script_path'; image_id=\$(docker inspect -f '{{.Image}}' easymod-backend-1); test -n \"\$image_id\"; docker run --rm --network easymod_internal --env-file '$probe_env_path' -e EXPECTED_DB_NAME=easymod_prod -e PROBE_SCHEMA_MODE=$schema_probe_mode -e PROBE_INBOUND_TRACE=\"$PROBE_INBOUND_TRACE\" -e TRACE_FROM=$trace_from_arg -e TRACE_TO=$trace_to_arg -e TRACE_MARKER=$trace_marker_arg -v '$probe_script_path:/app/scripts/production-db-auth-probe.js:ro' \"\$image_id\" node /app/scripts/production-db-auth-probe.js"

            # Report only safe configuration states and immutable running image
            # references. Never emit credential values from the live process.
            ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
              'set -eu
               for service in backend frontend; do
                 image=$(docker inspect -f "{{.Config.Image}}" "easymod-${service}-1")
                 case "$image" in *@sha256:*) ;; *) echo "ERROR: $service image is not digest-pinned" >&2; exit 1 ;; esac
                 printf "running_%s_image=%s\n" "$service" "$image"
               done
               docker exec easymod-backend-1 node -e "
                 const names = [\"GEMINI_API_KEY\", \"OPENAI_API_KEY\", \"BKASH_ENABLED\", \"OPS_ESCALATION_WEBHOOK_URL\", \"SLACK_ALERT_WEBHOOK_URL\", \"SENTRY_DSN\"];
                 for (const name of names) {
                   const value = process.env[name];
                   const state = name === \"BKASH_ENABLED\" ? (value === \"true\" ? \"enabled\" : \"disabled\") : (value ? \"configured\" : \"not configured\");
                   console.log(name + \"=\" + state);
                 }
               "'
           fi

  # ── 2d. Non-publishing Docker build validation ────────────────────────────
  # Build the exact current source on every branch, including pull requests,
  # without logging in to GHCR or pushing an image. The production build job
  # remains main-only, but a feature branch must still prove its Dockerfiles
  # and build contexts before it can be considered cutover-ready.
  docker-build-validation:
    name: Docker build validation (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, test, meta-e2e, deployment-config]
    # Pull requests get a non-publishing Docker build — on a PR this is the only
    # build proof. Main pushes and release workflow_call runs publish through the
    # `build` job, which already compiles the same Dockerfiles exactly once, so
    # validation here would be a duplicate candidate build.
    if: |
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    permissions:
      contents: read
      packages: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build backend image without publishing
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./EasyMod-backend
          file: ./EasyMod-backend/Dockerfile
          push: false
          load: true
          tags: easymod-backend:validation-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}

      - name: Build frontend image without publishing
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./EasyMod-frontend
          file: ./EasyMod-frontend/Dockerfile
          push: false
          load: true
          tags: easymod-frontend:validation-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.easymod.tech' }}
            VITE_APP_URL=${{ vars.VITE_APP_URL || 'https://app.easymod.tech' }}
            VITE_MARKETING_URL=${{ vars.VITE_MARKETING_URL || 'https://easymod.tech' }}
            VITE_META_APP_ID=${{ vars.VITE_META_APP_ID || '2040799330176198' }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_ENV=production
            VITE_BKASH_ENABLED=${{ vars.BKASH_ENABLED || 'false' }}

  # ── 2c. Backend integration — the suites that need a real database ─────────
  # `npm test` stubs the message queue and never opens a socket, so anything
  # asserting real transaction, isolation or constraint behaviour cannot run
  # there. Those suites are named *.integration.test.js and run here, against a
  # throwaway Postgres. They used to be excluded from jest.config.js instead,
  # which made them invisible rather than deferred.
  #
  # The database name must contain "test" or "e2e" as a whole word or the suite
  # refuses to start — see EasyMod-backend/tests/helpers/disposable-database.js.
  integration:
    name: Backend integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: none
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: easymod_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Pinned by digest like every other action in this repository. These two
      # arrived from the branch on floating @v6 tags and were the only
      # unpinned actions in .github/workflows.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.backend == 'true'
        with:
          node-version: '20'
          cache: npm

      # Installed from the repository root: EasyMod-backend is an npm
      # workspace, so `npm ci` inside it resolves the root lockfile into the
      # root node_modules regardless of working-directory.
      - name: Install workspace dependencies
        if: needs.changes.outputs.backend == 'true'
        run: npm ci

      # The service container starts empty. tests/integration/env.js configures
      # and guards the connection but never creates a schema, so without this
      # every case died on relation "users" does not exist.
      - name: Migrate the integration database
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_integration_test
          DB_SSL: 'false'
          NODE_ENV: test
        run: npm run migrate

      - name: Audit the migrated integration schema
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_integration_test
          DB_SSL: 'false'
          NODE_ENV: test
        run: npm run schema:audit

      - name: Backend integration suite
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        env:
          # The name must carry "test" or "e2e" as a whole word or
          # tests/helpers/disposable-database.js aborts the suite before the
          # first destructive statement.
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_integration_test
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:integration

      # Cutover drill: proves the delivered-order billing engine against the
      # migrated schema before it is allowed to cut over. Deferred script lands
      # in Phase 3; the alias is wired here so the gate cannot forget it.
      - name: Backend cutover drill
        if: needs.changes.outputs.backend == 'true'
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_integration_test
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:backend:cutover-drill

      # Known-broken tracked tests (EasyMod-backend/tests/quarantine.json). These
      # do NOT count as coverage and do NOT gate the build — they are run so the
      # debt is visible on every build instead of rotting inside an ignore list.
      # `npm test` already fails if this list grows past its ceiling.
      - name: Backend quarantine (reported, not gating)
        if: needs.changes.outputs.backend == 'true'
        continue-on-error: true
        working-directory: ./EasyMod-backend
        run: npm run test:quarantine

  # ── 3. Build & push Docker images ──────────────────────────────────────────
  build:
    name: Build & publish immutable images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    needs: [changes, test, integration, meta-e2e, deployment-config]
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
      backend_digest: ${{ steps.backend_image.outputs.digest || inputs.existing_backend_digest }}
      frontend_digest: ${{ steps.frontend_image.outputs.digest }}
      build_time: ${{ steps.meta.outputs.build_time }}
    env:
      EXISTING_BACKEND_DIGEST: ${{ inputs.existing_backend_digest }}
      EXISTING_CANDIDATE_SHA: ${{ inputs.existing_candidate_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          # BUILD_TIME used to come from the repository's last-metadata-change
          # stamp rather than this build. It ran *behind* the commit it labelled
          # (bc9c8ca reported builtAt 03:53:04Z for code authored 04:09:23Z) and
          # two pushes could share one value, collapsing two releases onto a
          # single Sentry `dist` marker. Stamp the build itself.
          # A guard test pins this line — see workflow-deploy-guard.test.js.
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            if [ -n "$EXISTING_BACKEND_DIGEST" ]; then
              test "$EXISTING_CANDIDATE_SHA" = "$SHA"
              printf '%s\n' "$EXISTING_BACKEND_DIGEST" | grep -Eq '^sha256:[0-9a-fA-F]{64}$'
              echo "backend_tag=${{ env.GHCR_BACKEND }}@${EXISTING_BACKEND_DIGEST}" >> $GITHUB_OUTPUT
            else
              echo "backend_tag=${{ env.GHCR_BACKEND }}:${SHA}" >> $GITHUB_OUTPUT
            fi
          else
            echo "backend_tag=" >> $GITHUB_OUTPUT
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            echo "frontend_tag=${{ env.GHCR_FRONTEND }}:${SHA}" >> $GITHUB_OUTPUT
          else
            echo "frontend_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend image
        id: backend_image
        if: needs.changes.outputs.backend == 'true' && env.EXISTING_BACKEND_DIGEST == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./EasyMod-backend
          file: ./EasyMod-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.backend_tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=registry,ref=${{ env.GHCR_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_BACKEND }}:buildcache,mode=max

      - name: Build & push frontend image
        id: frontend_image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./EasyMod-frontend
          file: ./EasyMod-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.frontend_tag }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.easymod.tech' }}
            VITE_APP_URL=${{ vars.VITE_APP_URL || 'https://app.easymod.tech' }}
            VITE_MARKETING_URL=${{ vars.VITE_MARKETING_URL || 'https://easymod.tech' }}
            VITE_META_APP_ID=${{ vars.VITE_META_APP_ID || '2040799330176198' }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_ENV=production
            VITE_BKASH_ENABLED=${{ vars.BKASH_ENABLED || 'false' }}
          cache-from: type=registry,ref=${{ env.GHCR_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_FRONTEND }}:buildcache,mode=max

  # ── 4. Deploy to DO droplet ──────────────────────────────────────────────────
  deploy:
    name: Production deploy + verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build, frontend-e2e]
    # A new monorepo must not switch the live droplet merely because its
    # default branch was populated. Enable this repository variable only after
    # deploy secrets, the production environment, and a rollback rehearsal are
    # explicitly verified.
    # A browser regression failure must block a production cutover. The job is
    # skipped for backend-only changes, so that result is explicitly allowed.
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.frontend-e2e.result == 'success' || needs.frontend-e2e.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      inputs.deploy_confirmation == format('DEPLOY-{0}', github.sha) &&
      (inputs.target != 'frontend' || inputs.existing_candidate_sha != '')
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Render and validate .env.prod without shell interpolation
        run: node EasyMod-backend/scripts/render-production-env.js _tmp/.env.prod
        env:
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          DELIVERY_ENCRYPTION_KEY: ${{ secrets.DELIVERY_ENCRYPTION_KEY }}
          REDX_WEBHOOK_SECRET: ${{ secrets.REDX_WEBHOOK_SECRET }}
          CHANNEL_ENCRYPTION_KEY: ${{ secrets.CHANNEL_ENCRYPTION_KEY }}
          PAYMENT_CALLBACK_HMAC_SECRET: ${{ secrets.PAYMENT_CALLBACK_HMAC_SECRET }}
          AI_ACTION_GATE_SECRET: ${{ secrets.AI_ACTION_GATE_SECRET }}
          MARKETING_URL: ${{ vars.MARKETING_URL || 'https://easymod.tech' }}
          APP_URL: ${{ vars.APP_URL || 'https://app.easymod.tech' }}
          API_URL: ${{ vars.API_URL || 'https://api.easymod.tech' }}
          PUBLIC_ASSET_URL: ${{ vars.PUBLIC_ASSET_URL || 'https://api.easymod.tech' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://app.easymod.tech,https://growth.easymod.tech' }}
          FRONTEND_URL: ${{ vars.APP_URL || 'https://app.easymod.tech' }}
          BASE_URL: ${{ vars.API_URL || 'https://api.easymod.tech' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_ASSET_URL || 'https://api.easymod.tech' }}
          # Deliberately unset by default: host-only API cookies minimize the
          # blast radius of an XSS on another easymod.tech subdomain.
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          LEGACY_COOKIE_DOMAIN: ${{ vars.LEGACY_COOKIE_DOMAIN || 'easymod.tech' }}
          META_OAUTH_REDIRECT_URI: ${{ vars.META_OAUTH_REDIRECT_URI || 'https://app.easymod.tech/channels/oauth-callback' }}
          META_APP_ID: ${{ vars.VITE_META_APP_ID || '2040799330176198' }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Facebook Login for Business configuration ID. Public, not a secret,
          # so it lives in a repository variable like META_OAUTH_REDIRECT_URI.
          # Deliberately NOT defaulted in-workflow: an unset variable must fail
          # the production config validation rather than deploy a login dialog
          # pointed at somebody else's configuration.
          META_LOGIN_CONFIG_ID: ${{ vars.META_LOGIN_CONFIG_ID }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          # Keep the canary default-off on every ordinary release. Only the
          # explicit protected repository-variable phrase can pass an enabled value.
          META_DISCOVERY_CANARY_ENABLED: ${{ vars.META_DISCOVERY_CANARY_CONFIRMATION == 'ENABLE-META-DISCOVERY-CANARY' && vars.META_DISCOVERY_CANARY_ENABLED == 'true' && 'true' || 'false' }}
          META_DISCOVERY_CANARY_SHOP_ID: ${{ vars.META_DISCOVERY_CANARY_CONFIRMATION == 'ENABLE-META-DISCOVERY-CANARY' && vars.META_DISCOVERY_CANARY_SHOP_ID || '' }}
          META_DISCOVERY_CANARY_PAGE_ID: ${{ vars.META_DISCOVERY_CANARY_CONFIRMATION == 'ENABLE-META-DISCOVERY-CANARY' && vars.META_DISCOVERY_CANARY_PAGE_ID || '' }}
          META_DISCOVERY_CANARY_EXPIRES_AT: ${{ vars.META_DISCOVERY_CANARY_CONFIRMATION == 'ENABLE-META-DISCOVERY-CANARY' && vars.META_DISCOVERY_CANARY_EXPIRES_AT || '' }}
          META_USER_PROFILE_ENABLED: ${{ vars.META_USER_PROFILE_ENABLED || 'false' }}
          GROWTH_OS_ENABLED: ${{ vars.GROWTH_OS_ENABLED || 'false' }}
          # Mobile API switch (ADR M-010). Operator-owned repository variable:
          # exactly "true" or "false", anything else fails the render.
          # Rollback: set it to "false" and redeploy
          # (docs/deployment/MOBILE_API_ACTIVATION_RUNBOOK.md).
          MOBILE_API_ENABLED: ${{ vars.MOBILE_API_ENABLED || 'false' }}
          # bKash is a LIVE-money gateway. It stays OFF for the controlled pilot
          # (finding F-14/§6). Flip the `BKASH_ENABLED` Actions *variable* to
          # "true" only once every BKASH_* secret is set AND a real-money test
          # has been signed off. While the variable is unset the render skips
          # every bKash credential, so a partial config cannot deploy live.
          BKASH_ENABLED: ${{ vars.BKASH_ENABLED || 'false' }}
          BKASH_BASE_URL: ${{ secrets.BKASH_BASE_URL }}
          BKASH_USERNAME: ${{ secrets.BKASH_USERNAME }}
          BKASH_PASSWORD: ${{ secrets.BKASH_PASSWORD }}
          BKASH_APP_KEY: ${{ secrets.BKASH_APP_KEY }}
          BKASH_APP_SECRET: ${{ secrets.BKASH_APP_SECRET }}
          BKASH_WEBHOOK_SECRET: ${{ secrets.BKASH_WEBHOOK_SECRET }}
          BKASH_SANDBOX: "false"
          # Facebook/Messenger is the cutover scope. Telegram is opt-in via a
          # repository variable and is disabled when the variable is absent.
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          # Customer-photo matching is opt-in; renderer defaults to false.
          AI_PHOTO_MATCH_ENABLED: ${{ vars.AI_PHOTO_MATCH_ENABLED || 'false' }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          QDRANT_VECTOR_SIZE: ${{ vars.QDRANT_VECTOR_SIZE || '384' }}
              # Backend alerting (finding F-06). The backend reads its own
              # SENTRY_DSN secret; never cross the server/browser configuration
              # boundary by falling back to the frontend's VITE_SENTRY_DSN.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Caddy ACME contact (repository variable — an email address is not a
          # secret, but it must never be committed; render fails without it).
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          ALLOW_SELF_SIGNED_TLS: ${{ secrets.ALLOW_SELF_SIGNED_TLS }}
          BODY_SIZE_LIMIT: ${{ secrets.BODY_SIZE_LIMIT || '35mb' }}
          PRODUCT_IMAGE_QUOTA_BYTES: ${{ vars.PRODUCT_IMAGE_QUOTA_BYTES || '104857600' }}
          MEDIA_FETCH_ALLOWED_HOSTS: ${{ secrets.MEDIA_FETCH_ALLOWED_HOSTS }}

      - name: Independent DB authentication probe against candidate environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
          GHCR_BACKEND: ${{ env.GHCR_BACKEND }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
          SCHEMA_DRIFT_MODE: ${{ inputs.expect_schema_drift == 'DRIFT' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
          schema_probe_mode='basic'
          if [ "$SCHEMA_DRIFT_MODE" = "true" ]; then
            schema_probe_mode='pre-migration'
          fi
          probe_env_path="/opt/easymod/.env.prod.candidate.${GITHUB_RUN_ID}"
          probe_script_path="/opt/easymod/production-db-auth-probe.${GITHUB_RUN_ID}.js"
          cleanup_probe() {
            ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
              "rm -f -- '$probe_env_path' '$probe_script_path'" >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          scp -i ~/.ssh/deploy_key _tmp/.env.prod \
            root@"$DEPLOY_HOST":"$probe_env_path"
          scp -i ~/.ssh/deploy_key EasyMod-backend/scripts/production-db-auth-probe.js \
            root@"$DEPLOY_HOST":"$probe_script_path"
          if [ -n "$BACKEND_DIGEST" ]; then
            probe_image="${GHCR_BACKEND}@${BACKEND_DIGEST}"
          else
            probe_image=''
          fi
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
            "set -e; chmod 600 '$probe_env_path'; chmod 644 '$probe_script_path'; image_ref='$probe_image'; if [ -z \"\$image_ref\" ]; then image_ref=\$(docker inspect -f '{{.Config.Image}}' easymod-backend-1); fi; test -n \"\$image_ref\"; printf '%s' \"\$image_ref\" | grep -Eq '@sha256:[0-9a-fA-F]{64}\$' || { echo 'candidate probe image is not digest-pinned' >&2; exit 1; }; if [ -n '$probe_image' ]; then printf '%s' '$GH_TOKEN' | docker login ghcr.io -u '$GH_ACTOR' --password-stdin >/dev/null; docker pull \"\$image_ref\" >/dev/null; fi; docker run --rm --network easymod_internal --env-file '$probe_env_path' -e EXPECTED_DB_NAME=easymod_prod -e PROBE_SCHEMA_MODE=$schema_probe_mode -v '$probe_script_path:/app/scripts/production-db-auth-probe.js:ro' \"\$image_ref\" node /app/scripts/production-db-auth-probe.js"

      - name: Copy .env.prod and deploy config to droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
          ROLLBACK_STATE_DIR: /opt/easymod/.cutover-rollback/${{ github.run_id }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" "set -e
            mkdir -p /opt/easymod '$ROLLBACK_STATE_DIR'
            chmod 700 /opt/easymod '$ROLLBACK_STATE_DIR'
            test -f /opt/easymod/.env.prod
            test -f /opt/easymod/docker-compose.prod.yml
            test -f /opt/easymod/Caddyfile
            cp -p /opt/easymod/.env.prod '$ROLLBACK_STATE_DIR/.env.prod'
            cp -p /opt/easymod/docker-compose.prod.yml '$ROLLBACK_STATE_DIR/docker-compose.prod.yml'
            cp -p /opt/easymod/Caddyfile '$ROLLBACK_STATE_DIR/Caddyfile'
            sha256sum '$ROLLBACK_STATE_DIR/.env.prod' '$ROLLBACK_STATE_DIR/docker-compose.prod.yml' '$ROLLBACK_STATE_DIR/Caddyfile' > '$ROLLBACK_STATE_DIR/manifest.sha256'
            chmod 600 '$ROLLBACK_STATE_DIR/.env.prod' '$ROLLBACK_STATE_DIR/manifest.sha256'"
          scp -i ~/.ssh/deploy_key _tmp/.env.prod root@"$DEPLOY_HOST":/opt/easymod/.env.prod
          # Sync compose + Caddy config straight from the runner's checkout. The
          # droplet has no GitHub auth, so its `git fetch` (in the deploy script)
          # silently failed and left STALE config on disk — which is why the F-05
          # `/health* -> backend` routing never reached production. scp makes the
          # runner the single source of truth for these two files.
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml root@"$DEPLOY_HOST":/opt/easymod/docker-compose.prod.yml
          scp -i ~/.ssh/deploy_key Caddyfile root@"$DEPLOY_HOST":/opt/easymod/Caddyfile
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" 'chmod 600 /opt/easymod/.env.prod && wc -l /opt/easymod/.env.prod && sha256sum /opt/easymod/Caddyfile /opt/easymod/docker-compose.prod.yml'

      - name: Derive pinned SSH host fingerprint
        id: ssh_host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          host_entry=$(ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" | awk '!/^#/ { print; exit }')
          key_type=$(printf '%s\n' "$host_entry" | awk '{ print $2 }')
          key_blob=$(printf '%s\n' "$host_entry" | awk '{ print $3 }')
          if [ -z "$key_type" ] || [ -z "$key_blob" ]; then
            echo '::error::pinned host key is missing for DEPLOY_HOST'
            exit 1
          fi
          fingerprint=$(printf '%s %s\n' "$key_type" "$key_blob" | ssh-keygen -lf - -E sha256 | awk '{ print $2 }')
          if [ -z "$fingerprint" ]; then
            echo '::error::could not derive the pinned host fingerprint'
            exit 1
          fi
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          fingerprint: ${{ steps.ssh_host.outputs.fingerprint }}
          timeout: 600s
          # `timeout` is the SSH connection budget. The deploy script (pull,
          # migrate, up, health gates, rollback trap) must not be cut off by
          # appleboy's 10-minute command default; 30m is explicit headroom.
          command_timeout: 30m
          envs: GHCR_BACKEND,GHCR_FRONTEND,GHCR_GROWTH,GROWTH_BOOTSTRAP_DIGEST,GROWTH_IMAGE_OVERRIDE,BACKEND_TAG,FRONTEND_TAG,BACKEND_DIGEST,FRONTEND_DIGEST,DEPLOYED_COMMIT,WORKFLOW_RUN_ID,DEPLOYED_AT,GH_ACTOR,GH_TOKEN,WIPE_DB,SEED_ADMIN,ROLLBACK_STATE_DIR,SCHEMA_DRIFT_MODE
          script: |
            set -e

            if [ "$WIPE_DB" = "WIPE" ]; then
              echo "ERROR: WIPE_DB=WIPE is disabled for production cutover; use a reviewed isolated recovery procedure"
              exit 1
            fi

            # Capture the running content-addressed images before any
            # replacement. A no-change service keeps its current digest; a
            # changed service consumes the digest emitted by the build job.
            resolve_container_digest() {
              local container="$1"
              local image_ref
              local digest
              image_ref=$(docker inspect -f '{{.Config.Image}}' "$container" 2>/dev/null || true)
              digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$image_ref" 2>/dev/null || true)
              case "$digest" in
                *@sha256:*) printf '%s' "$digest" ;;
                *) return 1 ;;
              esac
            }

            previous_backend_image=$(resolve_container_digest easymod-backend-1 2>/dev/null || true)
            previous_frontend_image=$(resolve_container_digest easymod-frontend-1 2>/dev/null || true)
            previous_growth_image=$(resolve_container_digest easymod-growth-frontend-1 2>/dev/null || true)

            if [ -z "$previous_backend_image" ] || [ -z "$previous_frontend_image" ]; then
              echo "ERROR: running services are not backed by content-addressed images; manual digest pinning is required before cutover"
              exit 1
            fi

            assert_immutable_ref() {
              if printf '%s' "$1" | grep -Eq '@sha256:[0-9a-fA-F]{64}$'; then
                return 0
              fi
              echo "ERROR: production image reference is not digest-pinned: $1" >&2
              return 1
            }

            candidate_backend_image="$previous_backend_image"
            candidate_frontend_image="$previous_frontend_image"
            if [ -n "$BACKEND_TAG" ] && [ -z "$BACKEND_DIGEST" ]; then
              echo "ERROR: changed backend has no candidate digest"
              exit 1
            fi
            if [ -n "$FRONTEND_TAG" ] && [ -z "$FRONTEND_DIGEST" ]; then
              echo "ERROR: changed frontend has no candidate digest"
              exit 1
            fi
            if [ -n "$BACKEND_DIGEST" ]; then
              candidate_backend_image="${GHCR_BACKEND}@${BACKEND_DIGEST}"
            fi
            if [ -n "$FRONTEND_DIGEST" ]; then
              candidate_frontend_image="${GHCR_FRONTEND}@${FRONTEND_DIGEST}"
            fi
            assert_immutable_ref "$candidate_backend_image"
            assert_immutable_ref "$candidate_frontend_image"
            export GHCR_IMAGE_BACKEND="$candidate_backend_image"
            export GHCR_IMAGE_FRONTEND="$candidate_frontend_image"

            # Growth OS is built and published by growth-os.yml, so this workflow
            # has no build-job digest to consume for it. When growth code changes
            # on main, the operator explicitly passes growth_image_override (the
            # digest published by growth-os.yml for that SHA) so this deploy swaps
            # the running Growth container to the new build. Without an override,
            # the running container's digest is carried forward untouched, so a
            # backend-only deploy never restarts Growth and cannot silently ship
            # a stale frontend.
            #
            # Fails closed exactly like backend and frontend above: a tag would
            # make the deploy non-reproducible and the rollback meaningless.
            # GROWTH_BOOTSTRAP_DIGEST remains the fallback for the first rollout
            # when growth-frontend is not running at all.
            growth_image_source=running
            candidate_growth_image=$(resolve_container_digest easymod-growth-frontend-1 2>/dev/null || true)
            if [ -n "${GROWTH_IMAGE_OVERRIDE:-}" ]; then
              echo "growth_image_override set; swapping growth-frontend to the pinned digest"
              candidate_growth_image="${GHCR_GROWTH}@${GROWTH_IMAGE_OVERRIDE}"
              growth_image_source=override
            elif [ -z "$candidate_growth_image" ] && [ -n "${GROWTH_BOOTSTRAP_DIGEST:-}" ]; then
              echo "growth-frontend is not running; bootstrapping from pinned GROWTH_BOOTSTRAP_DIGEST"
              candidate_growth_image="${GHCR_GROWTH}@${GROWTH_BOOTSTRAP_DIGEST}"
              growth_image_source=bootstrap
            fi
            if [ -z "$candidate_growth_image" ]; then
              echo "ERROR: growth-frontend is not running from a content-addressed image and"
              echo "       no GROWTH_BOOTSTRAP_DIGEST is set. Set the repository variable"
              echo "       GROWTH_BOOTSTRAP_DIGEST to the sha256:... digest of the Growth"
              echo "       image published by growth-os.yml for this commit, then re-run."
              exit 1
            fi
            assert_immutable_ref "$candidate_growth_image"
            export GHCR_IMAGE_GROWTH="$candidate_growth_image"

            cd /opt/easymod

            # The snapshot is created before this job overwrites any production
            # environment or routing/configuration file. Missing state fails
            # closed: image-only rollback is not a safe production rollback.
            if [ -z "${ROLLBACK_STATE_DIR:-}" ] \
              || [ ! -f "$ROLLBACK_STATE_DIR/.env.prod" ] \
              || [ ! -f "$ROLLBACK_STATE_DIR/docker-compose.prod.yml" ] \
              || [ ! -f "$ROLLBACK_STATE_DIR/Caddyfile" ] \
              || [ ! -f "$ROLLBACK_STATE_DIR/manifest.sha256" ]; then
              echo "ERROR: rollback environment/configuration snapshot is missing"
              exit 1
            fi

            # Validate every image in the interpolated production stack before
            # any pull, prune, restart, or destructive WIPE path. This is the
            # final fail-closed guard against a mutable reference entering the
            # deployed Compose configuration.
            production_images=$(docker compose --env-file .env.prod -f docker-compose.prod.yml config --images)
            while IFS= read -r production_image; do
              [ -z "$production_image" ] && continue
              assert_immutable_ref "$production_image"
            done <<< "$production_images"

            # docker-compose.prod.yml and Caddyfile are synced from the runner via
            # scp in the previous step (the droplet has no GitHub auth), so no git
            # pull is attempted here — that call always failed and left stale config.

            # ── Reclaim disk BEFORE pulling images ───────────────────────────────
            # The droplet ran out of space (accumulated deploy images + local DB
            # backups). That both failed `docker pull` and blocked Redis
            # persistence (stop-writes-on-bgsave-error -> API 500s). Free space
            # first so the pull and the running services can recover.
            echo "==> Disk usage before reclaim:"
            df -h / || true
            docker image prune -af || true
            docker builder prune -af || true
            docker container prune -f || true
            # Keep only the 3 newest local backups; the durable copy is off-site.
            if [ -d /opt/easymod/backups ]; then
              ls -1t /opt/easymod/backups/* 2>/dev/null | tail -n +4 | xargs -r rm -f || true
            fi
            echo "==> Disk usage after reclaim:"
            df -h / || true
            # A disk-full crash can corrupt Redis's append-only file, so the
            # container crash-loops and never passes its `redis-cli ping`
            # healthcheck. Because backend/worker/db:sync all wait on
            # `redis: condition: service_healthy`, that silently aborts the whole
            # deploy. Recover by resetting the persistence volume so Redis starts
            # clean. On a WIPE run this is always correct (clean first-run state);
            # otherwise only reset when Redis is genuinely unhealthy.
            if [ "$WIPE_DB" = "WIPE" ]; then
              echo "ERROR: Redis volume recovery is disabled in production; use a reviewed manual recovery procedure"
              exit 1
            else
              docker compose --env-file .env.prod -f docker-compose.prod.yml restart redis 2>/dev/null || true
              RSTATE=starting
              for k in $(seq 1 8); do
                RSTATE=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' easymod-redis-1 2>/dev/null || echo missing)
                [ "$RSTATE" = "healthy" ] && break
                [ "$RSTATE" = "unhealthy" ] && break
                sleep 5
              done
              if [ "$RSTATE" != "healthy" ]; then
                echo "ERROR: Redis is $RSTATE; refusing automatic volume deletion. Manual recovery is required"
                exit 1
              fi
            fi

            # Authenticate to ghcr.io on the droplet
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull the exact registry digests emitted by the build job. Tags are
            # retained only as human-readable publication labels and are never
            # used as a production deployment or rollback reference.
            if [ -n "$BACKEND_DIGEST" ]; then
              echo "Pulling backend digest: $GHCR_IMAGE_BACKEND"
              docker pull "$GHCR_IMAGE_BACKEND"
            fi

            if [ -n "$FRONTEND_DIGEST" ]; then
              echo "Pulling frontend digest: $GHCR_IMAGE_FRONTEND"
              docker pull "$GHCR_IMAGE_FRONTEND"
            fi

            if [ "$growth_image_source" != "running" ]; then
              if ! command -v jq >/dev/null 2>&1 || ! jq --version >/dev/null 2>&1; then
                echo "ERROR: jq is required on the deployment host to validate Growth build metadata"
                exit 1
              fi
              echo "Pulling Growth digest: $GHCR_IMAGE_GROWTH"
              docker pull "$GHCR_IMAGE_GROWTH"
              growth_build_info=$(docker run --rm "$GHCR_IMAGE_GROWTH" \
                cat /usr/share/nginx/html/build-info.json 2>/dev/null || true)
              if [ -z "$growth_build_info" ]; then
                echo "ERROR: Growth image build-info.json is missing or empty"
                exit 1
              fi
              if ! growth_build_commit=$(printf '%s' "$growth_build_info" | jq -er '.commit | select(type == "string" and length > 0)'); then
                echo "ERROR: Growth image build-info.json is malformed or has no non-empty commit"
                exit 1
              fi
              if [ "$growth_build_commit" != "$DEPLOYED_COMMIT" ]; then
                echo "ERROR: Growth image build-info commit '$growth_build_commit' does not match deployed commit '$DEPLOYED_COMMIT'"
                exit 1
              fi
              echo "Growth image commit binding verified: $growth_build_commit"
            fi

            # Validate the rendered environment with the candidate backend image
            # before replacing any running container.
            docker run --rm --env-file .env.prod "$GHCR_IMAGE_BACKEND" \
              node -e "require('./src/config/production-config.validator').assertProductionConfig(process.env)"

            verify_rollback() {
              local restored_backend restored_frontend restored_growth saved_hash current_hash
              restored_backend=$(docker inspect -f '{{.Config.Image}}' easymod-backend-1 2>/dev/null || true)
              restored_frontend=$(docker inspect -f '{{.Config.Image}}' easymod-frontend-1 2>/dev/null || true)
              if [ "$restored_backend" != "$previous_backend_image" ] || [ "$restored_frontend" != "$previous_frontend_image" ]; then
                echo "ERROR: rollback image references were not restored"
                return 1
              fi
              if [ -n "$previous_growth_image" ]; then
                restored_growth=$(docker inspect -f '{{.Config.Image}}' easymod-growth-frontend-1 2>/dev/null || true)
                if [ "$restored_growth" != "$previous_growth_image" ]; then
                  echo "ERROR: rollback Growth image reference was not restored"
                  return 1
                fi
              elif docker inspect easymod-growth-frontend-1 >/dev/null 2>&1; then
                echo "ERROR: rollback recreated a Growth container that was absent before cutover"
                return 1
              fi
              saved_hash=$(sha256sum "$ROLLBACK_STATE_DIR/.env.prod" | awk '{print $1}')
              current_hash=$(sha256sum /opt/easymod/.env.prod | awk '{print $1}')
              if [ "$saved_hash" != "$current_hash" ]; then
                echo "ERROR: rollback environment was not restored"
                return 1
              fi
              if ! cmp -s "$ROLLBACK_STATE_DIR/docker-compose.prod.yml" /opt/easymod/docker-compose.prod.yml \
                || ! cmp -s "$ROLLBACK_STATE_DIR/Caddyfile" /opt/easymod/Caddyfile; then
                echo "ERROR: rollback production configuration was not restored"
                return 1
              fi
              local backend_healthy=false
              for i in $(seq 1 20); do
                local status
                status=$(docker exec easymod-backend-1 node -e "require('http').get('http://127.0.0.1:3000/health/ready', r => { process.stdout.write(String(r.statusCode)); process.exit(0); }).on('error', () => { process.stdout.write('000'); process.exit(0); })" 2>/dev/null || echo "000")
                if [ "$status" = "200" ]; then
                  echo "Rollback backend health check passed on attempt $i"
                  backend_healthy=true
                  break
                fi
                sleep 5
              done
              if [ "$backend_healthy" != "true" ]; then
                echo "ERROR: rollback health check failed after 100s (backend)"
                return 1
              fi
              if [ -n "$previous_growth_image" ]; then
                local growth_status=starting
                for i in $(seq 1 20); do
                  growth_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' easymod-growth-frontend-1 2>/dev/null || echo missing)
                  [ "$growth_status" = "healthy" ] && break
                  sleep 5
                done
                if [ "$growth_status" != "healthy" ]; then
                  echo "ERROR: rollback Growth health check failed after 100s"
                  docker inspect easymod-growth-frontend-1 \
                    --format 'Rollback Growth health details: {{json .State.Health}}' 2>/dev/null || true
                  docker logs --tail 50 easymod-growth-frontend-1 2>/dev/null || true
                  return 1
                fi
              fi
              if ! docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T caddy \
                caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
                echo "ERROR: restored Caddy configuration failed validation"
                return 1
              fi
              echo "Rollback backend, Growth, Caddy, and configuration checks passed"
              return 0
            }

            rollback() {
              echo "ERROR: candidate deployment failed; restoring previous images and production configuration"
              if [ -z "$previous_backend_image" ] || [ -z "$previous_frontend_image" ]; then
                echo "ERROR: previous image references were unavailable; manual recovery is required"
                return 1
              fi
              if ! cp -p "$ROLLBACK_STATE_DIR/.env.prod" /opt/easymod/.env.prod \
                || ! cp -p "$ROLLBACK_STATE_DIR/docker-compose.prod.yml" /opt/easymod/docker-compose.prod.yml \
                || ! cp -p "$ROLLBACK_STATE_DIR/Caddyfile" /opt/easymod/Caddyfile; then
                echo "ERROR: rollback environment/configuration restore failed"
                return 1
              fi
              chmod 600 /opt/easymod/.env.prod
              export GHCR_IMAGE_BACKEND="$previous_backend_image"
              export GHCR_IMAGE_FRONTEND="$previous_frontend_image"
              # Compose still requires an immutable Growth value to render its
              # service. On a first rollout there is no previous Growth
              # container, so use the candidate only to render the stack and
              # remove that service immediately after restoring the incumbents.
              export GHCR_IMAGE_GROWTH="${previous_growth_image:-$candidate_growth_image}"
              if ! docker compose --env-file .env.prod -f docker-compose.prod.yml up --detach --no-build --remove-orphans; then
                echo "ERROR: rollback compose restore failed"
                return 1
              fi
              if [ -z "$previous_growth_image" ]; then
                if ! docker compose --env-file .env.prod -f docker-compose.prod.yml rm --force --stop growth-frontend; then
                  echo "ERROR: rollback could not remove the first-rollout Growth container"
                  return 1
                fi
              fi
              if ! docker compose --env-file .env.prod -f docker-compose.prod.yml restart caddy; then
                echo "ERROR: rollback Caddy restart failed"
                return 1
              fi
              verify_rollback
            }
            deploy_succeeded=false
            trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$deploy_succeeded" != "true" ]; then rollback || rc=70; fi; exit "$rc"' EXIT

            # ── DESTRUCTIVE WIPE (only when manually triggered with WIPE_DB=WIPE) ──
            if [ "$WIPE_DB" = "WIPE" ]; then
              echo "==> WIPE_DB=WIPE detected — dropping runtime DATABASE_URL database"
              docker compose --env-file .env.prod -f docker-compose.prod.yml stop backend worker 2>/dev/null || true
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps -T -e RUN_MIGRATIONS_ON_STARTUP=false backend node <<'NODE'
              const { Client } = require('pg');

              function quoteIdent(value) {
                return `"${String(value).replace(/"/g, '""')}"`;
              }

              function sslConfig() {
                const dbSsl = String(process.env.DB_SSL || '').toLowerCase();
                if (dbSsl !== 'true' && dbSsl !== '1') return false;
                return { rejectUnauthorized: String(process.env.ALLOW_SELF_SIGNED_TLS || '').toLowerCase() !== 'true' };
              }

              async function main() {
                if (!process.env.DATABASE_URL) {
                  throw new Error('DATABASE_URL is required for production wipe');
                }

                const appUrl = new URL(process.env.DATABASE_URL);
                const dbName = decodeURIComponent(appUrl.pathname.replace(/^\//, ''));
                const dbOwner = decodeURIComponent(appUrl.username || '');
                if (!dbName || ['postgres', 'template0', 'template1'].includes(dbName)) {
                  throw new Error(`Refusing to wipe reserved database: ${dbName || '(empty)'}`);
                }
                if (!dbOwner) {
                  throw new Error('DATABASE_URL username is required to recreate the database owner');
                }

                const adminUrl = new URL(process.env.DATABASE_URL);
                adminUrl.pathname = '/postgres';
                const ssl = sslConfig();
                const adminClient = new Client({ connectionString: adminUrl.toString(), ssl });
                await adminClient.connect();
                await adminClient.query(
                  'SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = $1 AND pid <> pg_backend_pid();',
                  [dbName]
                );
                await adminClient.query(`DROP DATABASE IF EXISTS ${quoteIdent(dbName)};`);
                await adminClient.query(`CREATE DATABASE ${quoteIdent(dbName)} OWNER ${quoteIdent(dbOwner)};`);
                await adminClient.end();

                const appClient = new Client({ connectionString: process.env.DATABASE_URL, ssl });
                await appClient.connect();
                await appClient.query('CREATE EXTENSION IF NOT EXISTS "uuid-ossp";');
                await appClient.end();

                console.log(`==> Runtime database wiped: ${dbName}`);
              }

              main().catch((error) => {
                console.error(error);
                process.exit(1);
              });
            NODE
              echo "==> Bootstrapping entity tables via node src/utils/database/sync.js"
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm -e RUN_MIGRATIONS_ON_STARTUP=false backend node src/utils/database/sync.js
              echo "==> Seeding migrations table so the runner skips already-applied DDL"
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm -e RUN_MIGRATIONS_ON_STARTUP=false backend node src/database/migrate.js seed-as-executed
              echo "==> DB wiped, synced, and migration history primed"

              # Full reset: a true first-time state must also clear the other
              # stateful stores, otherwise stale dedup keys can suppress new
              # messages, orphaned RAG vectors can bleed into AI replies, and
              # old attachment URLs can expose previous merchant media.
              echo "==> Flushing Redis (BullMQ jobs, dedup keys, rate buckets, SSE replay, sessions)"
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T redis redis-cli FLUSHALL || true
              echo "==> Clearing backend uploads volume"
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps backend sh -lc 'find /app/uploads -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +'
              echo "==> Resetting Qdrant vector store (RAG embeddings)"
              QDRANT_VOLUME=$(docker inspect easymod-qdrant-1 --format '{{range .Mounts}}{{if eq .Destination "/qdrant/storage"}}{{.Name}}{{end}}{{end}}' 2>/dev/null || true)
              docker compose --env-file .env.prod -f docker-compose.prod.yml stop qdrant 2>/dev/null || true
              docker compose --env-file .env.prod -f docker-compose.prod.yml rm -f qdrant 2>/dev/null || true
              if [ -n "$QDRANT_VOLUME" ]; then
                docker volume rm "$QDRANT_VOLUME" 2>/dev/null || true
              fi
              echo "==> Redis flushed, uploads cleared, and Qdrant volume reset"
            fi

            # Run additive migrations from the candidate backend image before
            # replacing the currently running API and worker. This prevents new
            # application code from starting against an old schema.
            if [ -n "$BACKEND_TAG" ] && [ "$WIPE_DB" != "WIPE" ]; then
              threshold_snapshot_before=$(docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres \
                sh -c 'psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*)::text || chr(58) || COALESCE(SUM(threshold_conversations), 0)::text || chr(58) || COALESCE(MIN(threshold_conversations), 0)::text || chr(58) || COALESCE(MAX(threshold_conversations), 0)::text FROM public.subscriptions"' \
                | tr -d '\r\n')
              test -n "$threshold_snapshot_before"
              echo "THRESHOLD_CONVERSATIONS_SNAPSHOT_BEFORE=$threshold_snapshot_before"
              migration_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              echo "MIGRATION_START=$migration_started_at"
              echo "Running database migrations before service replacement..."
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps -T \
                -e RUN_MIGRATIONS_ON_STARTUP=false backend node src/database/migrate.js up
              threshold_snapshot_after=$(docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres \
                sh -c 'psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*)::text || chr(58) || COALESCE(SUM(threshold_conversations), 0)::text || chr(58) || COALESCE(MIN(threshold_conversations), 0)::text || chr(58) || COALESCE(MAX(threshold_conversations), 0)::text FROM public.subscriptions"' \
                | tr -d '\r\n')
              test "$threshold_snapshot_before" = "$threshold_snapshot_after"
              echo "THRESHOLD_CONVERSATIONS_SNAPSHOT_AFTER=$threshold_snapshot_after"
              echo 'THRESHOLD_CONVERSATIONS_PRESERVED=PASS'
              # threshold_debt is a legacy field the retired grace-buffer flow no
              # longer writes, but the migration deliberately does not reset an
              # existing nonzero value on rerun (commercial-entity-drift.integration.test.js
              # proves this). Asserting it is uniformly zero is only true for THIS
              # one-shot repair, where the column is being added fresh — it must
              # not run on every future deploy, or the day any row legitimately
              # (or via a manual fix) carries nonzero debt, every subsequent
              # deploy would hard-fail here.
              if [ "$SCHEMA_DRIFT_MODE" = "true" ]; then
                nonzero_debt_count=$(docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres \
                  sh -c 'psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM public.subscriptions WHERE threshold_debt <> 0"' \
                  | tr -d '\r\n')
                test "$nonzero_debt_count" = 0
                echo 'THRESHOLD_DEBT_INITIALIZATION=CORRECT'
              else
                echo 'THRESHOLD_DEBT_INITIALIZATION=SKIPPED (not a one-shot drift-repair run)'
              fi
              repair_ledger_rows=$(docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres \
                sh -c 'psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT COUNT(*) FROM public.migrations WHERE name LIKE '\''20260901_001_reconcile_commercial_entity_drift%'\''"' \
                | tr -d '\r\n')
              test "$repair_ledger_rows" = 1
              echo 'REPAIR_LEDGER_ENTRY_COUNT=1'
            else
              migration_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              echo "MIGRATION_START=$migration_started_at"
            fi

            # Migration names are not schema proof. Audit the target database
            # from the exact candidate image after migration and before any
            # service replacement; a missing entity column must fail closed.
            echo "Auditing production schema before service replacement..."
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps -T \
              -e RUN_MIGRATIONS_ON_STARTUP=false backend node scripts/schema-drift-audit.js

            # Exercise the same startup dependencies as server.js while the
            # candidate image is still disposable. This exposes production-only
            # DB, active-integration, Redis, or app-module failures before any
            # long-lived container is replaced.
            echo "==> Preflighting candidate backend startup dependencies"
            preflight_container_name="easymod-backend-preflight-${WORKFLOW_RUN_ID:-unknown}"
            docker rm -f "$preflight_container_name" >/dev/null 2>&1 || true
            if ! command -v timeout >/dev/null 2>&1; then
              echo "ERROR: timeout is required on the deployment host for bounded startup preflight"
              exit 1
            fi
            preflight_rc=0
            if ! timeout --signal=TERM --kill-after=10s 120s \
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps -T \
              -e RUN_MIGRATIONS_ON_STARTUP=false --name "$preflight_container_name" backend node - <<'NODE'
            require('module-alias/register');
            const closeWithTimeout = async (label, close) => {
              try {
                await Promise.race([
                  Promise.resolve().then(close),
                  new Promise((resolve) => setTimeout(resolve, 5000)),
                ]);
              } catch (error) {
                console.warn(`Candidate backend ${label} cleanup failed:`, error.message);
              }
            };

            (async () => {
              const { sequelize } = require('src/utils/database/database-setup');
              const { getRedisClient, closeRedis } = require('src/utils/redis-client');
              let exitCode = 0;
              try {
                require('src/app');
                await sequelize.authenticate();
                console.log('Candidate backend database connection passed');
                await require('src/config/production-integration.validator').assertProductionIntegrations();
                const redis = getRedisClient();
                if (redis) {
                  await new Promise((resolve) => setTimeout(resolve, 500));
                  await redis.ping();
                  console.log('Candidate backend Redis connection passed');
                }
              } catch (error) {
                console.error('Candidate backend startup preflight failed:', error);
                exitCode = 1;
              } finally {
                await closeWithTimeout('database', () => sequelize.close());
                await closeWithTimeout('Redis', () => closeRedis());
                process.exit(exitCode);
              }
            })();
            NODE
            then
              echo "ERROR: candidate backend startup preflight failed"
              preflight_rc=1
            fi
            docker rm -f "$preflight_container_name" >/dev/null 2>&1 || true
            if [ "$preflight_rc" -ne 0 ]; then
              exit "$preflight_rc"
            fi

            # Start application services before the edge. Starting Caddy in the
            # same Compose transaction makes its dependency wait abort before
            # the candidate backend's 60-second health start period elapses.
            echo "==> Starting candidate application services"
            if ! docker compose --env-file .env.prod -f docker-compose.prod.yml \
              up -d --no-build --remove-orphans backend worker frontend growth-frontend; then
              echo "ERROR: candidate application services failed to start"
              docker inspect easymod-backend-1 \
                --format 'Candidate backend state: status={{.State.Status}} exit={{.State.ExitCode}} restart={{.RestartCount}} oom={{.State.OOMKilled}} error={{.State.Error}}' 2>/dev/null || true
              docker inspect easymod-backend-1 \
                --format 'Candidate backend health details: {{json .State.Health}}' 2>/dev/null || true
              docker ps -a --filter name=easymod-backend-1 --no-trunc 2>/dev/null || true
              docker logs --tail 100 easymod-backend-1 2>/dev/null || true
              exit 1
            fi

            candidate_backend_healthy=false
            for i in $(seq 1 20); do
              candidate_backend_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' easymod-backend-1 2>/dev/null || echo missing)
              if [ "$candidate_backend_status" = "healthy" ]; then
                echo "Candidate backend health check passed on attempt $i"
                candidate_backend_healthy=true
                break
              fi
              echo "Candidate backend health attempt $i: status=$candidate_backend_status — retrying in 5s..."
              sleep 5
            done
            if [ "$candidate_backend_healthy" != "true" ]; then
              echo "ERROR: candidate backend health check failed after 100s"
              docker inspect easymod-backend-1 \
                --format 'Candidate backend state: status={{.State.Status}} exit={{.State.ExitCode}} restart={{.RestartCount}} oom={{.State.OOMKilled}} error={{.State.Error}}' 2>/dev/null || true
              docker inspect easymod-backend-1 \
                --format 'Candidate backend health details: {{json .State.Health}}' 2>/dev/null || true
              docker ps -a --filter name=easymod-backend-1 --no-trunc 2>/dev/null || true
              docker logs --tail 100 easymod-backend-1 2>/dev/null || true
              exit 1
            fi

            echo "==> Starting Caddy after candidate backend health passed"
            if ! docker compose --env-file .env.prod -f docker-compose.prod.yml \
              up -d --no-build --remove-orphans caddy; then
              echo "ERROR: candidate Caddy failed to start"
              docker logs --tail 100 easymod-caddy-1 2>/dev/null || true
              exit 1
            fi

            # The Caddyfile is bind-mounted read-only, so `up -d` will NOT restart
            # Caddy just because the file's contents changed. Reload it explicitly
            # so the F-05 `/health* -> backend` routing actually takes effect.
            echo "==> Reloading Caddy with synced config"
            if ! docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null; then
              docker compose --env-file .env.prod -f docker-compose.prod.yml restart caddy
            fi

            # Idempotent production review account seed. Requires exact SEED input
            # so normal deploys do not reset credentials or grant admin access.
            if [ "$SEED_ADMIN" = "SEED" ]; then
              echo "==> Seeding production admin review account"
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T backend node src/scripts/seed-admin.js
            fi

            # Health check
            for i in $(seq 1 20); do
              STATUS=$(docker exec easymod-backend-1 node -e "require('http').get('http://127.0.0.1:3000/health/ready', r => { process.stdout.write(String(r.statusCode)); process.exit(0); }).on('error', () => { process.stdout.write('000'); process.exit(0); })" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed on attempt $i"
                break
              fi
              echo "Attempt $i: status=$STATUS — retrying in 5s..."
              sleep 5
              if [ "$i" = "20" ]; then
                echo "ERROR: Health check failed after 100s"
                exit 1
              fi
            done

            # Read the commit baked into the running image. A healthy container
            # is not sufficient evidence that the requested immutable image is
            # serving traffic; the version endpoint must identify this SHA.
            docker exec -i -e EXPECTED_COMMIT="$DEPLOYED_COMMIT" easymod-backend-1 node - <<'NODE'
            const http = require('http');

            const request = http.get('http://127.0.0.1:3000/api/version', (response) => {
              let body = '';
              response.setEncoding('utf8');
              response.on('data', (chunk) => { body += chunk; });
              response.on('end', () => {
                if (response.statusCode !== 200) {
                  console.error(`Version endpoint returned HTTP ${response.statusCode}`);
                  process.exit(1);
                }

                let payload;
                try {
                  payload = JSON.parse(body);
                } catch (error) {
                  console.error(`Version endpoint returned invalid JSON: ${error.message}`);
                  process.exit(1);
                }

                if (payload.gitSha !== process.env.EXPECTED_COMMIT) {
                  console.error(`Version mismatch: expected ${process.env.EXPECTED_COMMIT}, got ${payload.gitSha || '(missing)'}`);
                  process.exit(1);
                }
                console.log(`Version check passed: ${payload.gitSha}`);
              });
            });
            request.on('error', (error) => {
              console.error(`Version endpoint request failed: ${error.message}`);
              process.exit(1);
            });
            NODE

            # Clean up dangling images
            docker image prune -f

            cat > /opt/easymod/deployment-metadata.json <<EOF
            {
              "DEPLOYED_COMMIT": "${DEPLOYED_COMMIT}",
              "BACKEND_IMAGE_DIGEST": "${GHCR_IMAGE_BACKEND}",
              "FRONTEND_IMAGE_DIGEST": "${GHCR_IMAGE_FRONTEND}",
              "GROWTH_IMAGE_DIGEST": "${GHCR_IMAGE_GROWTH}",
              "PREVIOUS_BACKEND_IMAGE_DIGEST": "${previous_backend_image}",
              "PREVIOUS_FRONTEND_IMAGE_DIGEST": "${previous_frontend_image}",
              "PREVIOUS_GROWTH_IMAGE_DIGEST": "${previous_growth_image}",
              "WORKFLOW_RUN_ID": "${WORKFLOW_RUN_ID}",
              "DEPLOYED_AT": "${DEPLOYED_AT}"
            }
            EOF
            chmod 600 /opt/easymod/deployment-metadata.json
            deploy_succeeded=true

        env:
          GHCR_BACKEND: ${{ env.GHCR_BACKEND }}
          GHCR_FRONTEND: ${{ env.GHCR_FRONTEND }}
          GHCR_GROWTH: ${{ env.GHCR_GROWTH }}
          GROWTH_BOOTSTRAP_DIGEST: ${{ vars.GROWTH_BOOTSTRAP_DIGEST }}
          GROWTH_IMAGE_OVERRIDE: ${{ inputs.growth_image_override }}
          BACKEND_TAG: ${{ needs.build.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.build.outputs.frontend_tag }}
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
          DEPLOYED_COMMIT: ${{ inputs.existing_candidate_sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          DEPLOYED_AT: ${{ needs.build.outputs.build_time }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIPE_DB: ${{ inputs.wipe_db_first }}
          SEED_ADMIN: ${{ inputs.seed_admin }}
          ROLLBACK_STATE_DIR: /opt/easymod/.cutover-rollback/${{ github.run_id }}
          SCHEMA_DRIFT_MODE: ${{ inputs.expect_schema_drift == 'DRIFT' }}

  # PRODUCTION_DEPLOY_ENABLED is an operator-owned repository control. The
  # built-in GITHUB_TOKEN cannot mutate repository variables, so it must be
  # disabled explicitly through the repository control plane after each bounded
  # production run rather than pretending an in-workflow cleanup succeeded.

  # ── 4. Growth OS verification, driven from the PR gate ─────────────────────
  # growth-os.yml has no pull_request trigger: its workflow-level paths filter
  # meant the workflow never started on an unrelated diff, so its required job
  # contexts never existed and every such PR sat on "Expected — waiting for
  # status" forever. Calling it from here inverts that — this workflow always
  # runs on a PR, and the `if` below decides whether Growth is affected. A
  # skipped call is a real, reported "not required", not a missing context.
  growth-os:
    name: Growth OS PR verification
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.growth == 'true'
    uses: ./.github/workflows/growth-os.yml
    # GitHub's plan-time validation requires this caller's permission ceiling
    # to be a superset of `growth-os.yml`'s own top-level `permissions:` block.
    # The reusable workflow keeps `packages: write` at its workflow level because
    # its `build-and-push` job needs it. The two growth jobs that CAN see PR
    # code (`verify`, `browser-e2e`) each declare their own job-scoped
    # `permissions: contents: read` inside growth-os.yml to narrow their token
    # below the ceiling; `build-and-push` never executes on a pull_request
    # (its `if:` refuses), so PR-controlled code cannot acquire a package-write
    # token through the reusable path — the ceiling here and the callee-side
    # job-scope narrowing together form the invariant.
    permissions:
      contents: read
      # The called workflow declares a main/manual-only publish job requiring
      # package write permission. Its pull_request condition still skips that
      # job; this ceiling is required for reusable-workflow validation.
      packages: write

  # ── 5. The one required PR context ─────────────────────────────────────────
  # Branch protection requires exactly this job plus "Security Scan". It has no
  # `if` and no paths filter, so it ALWAYS reports on a PR into main, and it
  # always reports a real verdict:
  #
  #   failure/cancelled in any upstream job  -> FAIL
  #   upstream skipped because the diff does not touch it -> reported as
  #     "not required", which is not the same as pretending it ran
  #
  # It also carries the validation a docs-only diff would otherwise get none of:
  # whitespace/conflict markers and Markdown link integrity.
  pr-merge-gate:
    name: PR Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && github.event_name == 'pull_request'
    needs:
      - changes
      - test
      - frontend-e2e
      - meta-e2e
      - integration
      - deployment-config
      - docker-build-validation
      - growth-os
    permissions:
      contents: read
      packages: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate documentation and diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Whitespace damage and CR/LF violations, per the repo's .gitattributes.
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No files changed."
          else
            node scripts/pr-docs-check.js "${changed[@]}"
          fi

      # Commercial truth gate: frozen-contract hashes, claim registry, evidence
      # authorities, collateral drift and the forbidden-token worklist. Runs
      # without `npm ci` because the scanner is dependency-free.
      - name: Verify commercial claims
        run: node scripts/verify-claims/index.js

      - name: Report the gate verdict
        env:
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          GROWTH: ${{ needs.changes.outputs.growth }}
          R_CHANGES: ${{ needs.changes.result }}
          R_TEST: ${{ needs.test.result }}
          R_FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
          R_META_E2E: ${{ needs.meta-e2e.result }}
          R_INTEGRATION: ${{ needs.integration.result }}
          R_DEPLOY_CONFIG: ${{ needs.deployment-config.result }}
          R_DOCKER: ${{ needs.docker-build-validation.result }}
          R_GROWTH: ${{ needs.growth-os.result }}
        run: |
          set -euo pipefail

          failed=0

          # A skipped job is a legitimate "this diff does not touch it". A
          # failed or cancelled one is not, and neither is a skipped `changes`
          # — that one has no `if` and must always succeed.
          verdict() {
            local label="$1" result="$2" relevant="$3"
            case "$result" in
              success)   echo "PASS         $label" ;;
              skipped|"") if [ "$relevant" = "true" ]; then
                            echo "MISSING      $label (expected to run for this diff)"
                            failed=1
                          else
                            echo "NOT REQUIRED $label — no impacting paths changed"
                          fi ;;
              *)         echo "FAIL         $label ($result)"; failed=1 ;;
            esac
          }

          code_changed=false
          if [ "$BACKEND" = "true" ] || [ "$FRONTEND" = "true" ]; then code_changed=true; fi

          echo "── PR Merge Gate ─────────────────────────────────────────────"
          verdict "Detect changed services"                "$R_CHANGES"        true
          verdict "Quality fast"                         "$R_TEST"           "$code_changed"
          verdict "EasyModerator frontend Playwright"      "$R_FRONTEND_E2E"   "$FRONTEND"
          verdict "Meta-shaped E2E (AI trust boundary)"    "$R_META_E2E"       "$code_changed"
          verdict "Backend integration (PostgreSQL+Redis)" "$R_INTEGRATION"    "$code_changed"
          verdict "Deployment configuration dry run"       "$R_DEPLOY_CONFIG"  "$code_changed"
          verdict "Docker build validation (no push)"      "$R_DOCKER"         "$code_changed"
          verdict "Growth OS verification"                 "$R_GROWTH"         "$GROWTH"
          echo "── documentation and diff hygiene: PASS ──────────────────────"

          if [ "$failed" -ne 0 ]; then
            echo "PR Merge Gate: FAIL"
            exit 1
          fi
          echo "PR Merge Gate: PASS"
