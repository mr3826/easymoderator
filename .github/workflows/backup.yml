name: Database Backup

on:
  schedule:
    # Daily at 02:00 UTC (08:00 Bangladesh time); active merchant/payment data
    # should not accept a seven-day recovery point objective.
    # Operator notes (observed 2026-11): GitHub's scheduler actually fires this
    # ~08:0x-09:0x UTC, and each run then waits on the manual production
    # environment approval (founder decision 2026-11-14: keep manual). The
    # effective RPO is therefore "next approval", not 02:00 UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      restore_drill:
        description: Restore the recorded production dump into an isolated throwaway database
        required: false
        default: false
        type: boolean
      forward_migration_image:
        description: 'Backend image whose migrations must apply to the restored dump; defaults to the image production currently runs'
        required: false
        default: ''
        type: string

concurrency:
  group: production-backup
  # Backups and restore drills must not race over the newest receipt/archive.
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets:
#   DEPLOY_HOST        — production host IP or hostname (OCI host since the
#                        2026-11-13 cutover; secret name kept from the DO era)
#   DO_SSH_PRIVATE_KEY — SSH private key with root access to the production
#                        host (name kept from the DO era; value is the OCI key)
#
# Local backups are written to /opt/easymod/backups/ (7-day retention).
#
# OFF-SITE backups (finding F-04) are MANDATORY and fail closed. The target is
# OCI Object Storage via its S3-compatible API; secret names are kept from the
# DO Spaces era (see docs/infrastructure/OCI_MIGRATION_DESIGN.md §1.2/§2.3):
#   BACKUP_ENCRYPTION_KEY     — passphrase for client-side AES-256 (app-owned;
#                               losing it makes archives unrecoverable — keep
#                               an off-platform copy)
#   SPACES_ACCESS_KEY_ID      — OCI Customer Secret Key access id
#   SPACES_SECRET_ACCESS_KEY  — OCI Customer Secret Key secret
#   SPACES_ENDPOINT           — https://<namespace>.compat.objectstorage.<region>.oraclecloud.com
#                               (the non-compat hostname does NOT serve the S3 API)
#   BACKUP_BUCKET             — bucket name
#
# Bucket privacy and lifecycle retention are audited OCI-natively after every
# upload — the S3-compat API cannot read OCI lifecycle policies — using a
# restricted read-only identity (`read buckets in tenancy` and nothing else):
#   OCI_AUDIT_PRIVATE_KEY (secret); OCI_AUDIT_TENANCY_OCID, OCI_AUDIT_USER_OCID,
#   OCI_AUDIT_FINGERPRINT, OCI_AUDIT_NAMESPACE, OCI_AUDIT_REGION (repo variables).
# A backup that sits only on the host it protects does not satisfy the pilot
# DR requirement, so every credential above is all-or-nothing.
# ──────────────────────────────────────────────────────────────────────────────

# The backup job talks to the production host over SSH and to object storage
# over HTTPS; it never calls the GitHub API, so it needs no token scope at all.
# Declared explicitly rather than inherited: the repository default is currently
# read, but a workflow that states its own permissions does not silently widen
# if that default is ever changed.
permissions:
  contents: read
  packages: read

jobs:
  backup:
    name: Backup PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Derive pinned SSH host fingerprint
        id: ssh_host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          host_entry=$(ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" | awk '!/^#/ { print; exit }')
          key_type=$(printf '%s\n' "$host_entry" | awk '{ print $2 }')
          key_blob=$(printf '%s\n' "$host_entry" | awk '{ print $3 }')
          if [ -z "$key_type" ] || [ -z "$key_blob" ]; then
            echo '::error::pinned host key is missing for DEPLOY_HOST'
            exit 1
          fi
          fingerprint=$(printf '%s %s\n' "$key_type" "$key_blob" | ssh-keygen -lf - -E sha256 | awk '{ print $2 }')
          if [ -z "$fingerprint" ]; then
            echo '::error::could not derive the pinned host fingerprint'
            exit 1
          fi
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Run pg_dump + encrypted off-site upload via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          OFFSITE_RETENTION_DAYS: ${{ vars.OFFSITE_RETENTION_DAYS || '30' }}
          BACKUP_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          fingerprint: ${{ steps.ssh_host.outputs.fingerprint }}
          timeout: 300s
          # pg_dump + validation + off-site upload must not be reaped by the
          # transport's hidden 10-minute command default.
          command_timeout: 30m
          envs: BACKUP_ENCRYPTION_KEY,SPACES_ACCESS_KEY_ID,SPACES_SECRET_ACCESS_KEY,SPACES_ENDPOINT,BACKUP_BUCKET,OFFSITE_RETENTION_DAYS,BACKUP_RUN_ID
          script: |
            set -euo pipefail
            umask 077

            BACKUP_DIR=/opt/easymod/backups
            mkdir -p "$BACKUP_DIR"
            AWS_CLI_IMAGE='amazon/aws-cli@sha256:165b494a2acea6b41fd5bb6f9b0ce903124f9cf2da2faab61e9c3c95b8d8a1b9'
            POSTGRES_HELPER_IMAGE='postgres@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a'

            # Fail fast — before any dump work: the off-site target is
            # mandatory and all-or-nothing. A partial config is treated as
            # "not configured" so we never upload UNENCRYPTED (missing
            # BACKUP_ENCRYPTION_KEY) or to an unauthenticated target.
            if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ] || [ -z "${SPACES_ACCESS_KEY_ID:-}" ] \
               || [ -z "${SPACES_SECRET_ACCESS_KEY:-}" ] || [ -z "${SPACES_ENDPOINT:-}" ] \
               || [ -z "${BACKUP_BUCKET:-}" ]; then
              echo "::error::OFFSITE_CREDENTIALS_MISSING (F-04 BLOCKED_EXTERNAL_CREDENTIAL)"
              echo "RECOVERY_EXECUTION_PAUSED_FOR_CREDENTIAL"
              exit 1
            fi
            case "$SPACES_ENDPOINT" in
              https://*) ;;
              *) echo "::error::SPACES_ENDPOINT must use HTTPS"; exit 1 ;;
            esac

            # Reachability + auth probe against the S3-compatible endpoint,
            # replacing the retired account-token probe. Runs in the pinned
            # aws-cli container; no credential is printed on failure.
            if ! docker run --rm \
              -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
              "$AWS_CLI_IMAGE" s3api head-bucket --bucket "$BACKUP_BUCKET" \
              --endpoint-url "$SPACES_ENDPOINT" >/dev/null 2>&1; then
              echo "::error::OFFSITE_BUCKET_UNREACHABLE head-bucket failed for the configured endpoint/bucket"
              echo "RECOVERY_EXECUTION_PAUSED_FOR_CREDENTIAL"
              exit 1
            fi
            echo "Off-site target reachable: head-bucket PASS"

            # The production compose contract requires immutable image
            # references even for read-only commands such as `exec`. Resolve
            # the exact refs already running on the host so backup never
            # falls back to a mutable tag or accidentally targets a different
            # application release.
            RUNNING_BACKEND_IMAGE=$(docker inspect easymod-backend-1 --format '{{.Config.Image}}')
            RUNNING_WORKER_IMAGE=$(docker inspect easymod-worker-1 --format '{{.Config.Image}}')
            RUNNING_FRONTEND_IMAGE=$(docker inspect easymod-frontend-1 --format '{{.Config.Image}}')
            RUNNING_GROWTH_IMAGE=$(docker inspect easymod-growth-frontend-1 --format '{{.Config.Image}}' 2>/dev/null || true)

            if [ "$RUNNING_BACKEND_IMAGE" != "$RUNNING_WORKER_IMAGE" ]; then
              echo "::error::BACKUP_IMAGE_CONTRACT_FAILED backend-and-worker-images-differ"
              exit 1
            fi
            if [ -z "$RUNNING_GROWTH_IMAGE" ]; then
              # Backups protect merchant data; the internal Growth SPA is not
              # part of that contract and must not block one. Satisfy the
              # compose interpolation contract with the deployment-recorded
              # pinned reference instead of the running container.
              echo "::notice::BACKUP_GROWTH_IMAGE_SOURCE=deployment-record growth-frontend is not running"
              # The host is not guaranteed to run node; parse the recorded
              # deployment metadata with portable tools only.
              RUNNING_GROWTH_IMAGE=$(sed -n 's/.*"GROWTH_IMAGE_DIGEST": *"\([^"]*\)".*/\1/p' /opt/easymod/deployment-metadata.json 2>/dev/null | head -n 1)
            fi
            if [ -z "$RUNNING_GROWTH_IMAGE" ]; then
              echo "::error::BACKUP_GROWTH_IMAGE_CONTRACT_FAILED no running container or deployment-record reference for growth"
              exit 1
            fi

            for IMAGE_REF in "$RUNNING_BACKEND_IMAGE" "$RUNNING_FRONTEND_IMAGE" "$RUNNING_GROWTH_IMAGE"; do
              if ! printf '%s' "$IMAGE_REF" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'; then
                echo "::error::BACKUP_IMAGE_CONTRACT_FAILED image-is-not-digest-pinned"
                exit 1
              fi
            done

            export GHCR_IMAGE_BACKEND="$RUNNING_BACKEND_IMAGE"
            export GHCR_IMAGE_FRONTEND="$RUNNING_FRONTEND_IMAGE"
            export GHCR_IMAGE_GROWTH="$RUNNING_GROWTH_IMAGE"
            echo "Immutable compose image contract verified for running release"

            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            test -n "${BACKUP_RUN_ID:-}"
            BACKUP_FILE="$BACKUP_DIR/easymod-${TIMESTAMP}-${BACKUP_RUN_ID}.dump"
            BACKUP_TMP_FILE="$BACKUP_FILE.partial"
            UPLOADS_BACKUP_FILE="easymod-uploads-${TIMESTAMP}-${BACKUP_RUN_ID}.tar.gz"
            trap 'rm -f "$BACKUP_TMP_FILE" "$BACKUP_DIR"/*.readback.dump "$BACKUP_DIR"/*.readback.enc "$BACKUP_DIR"/*.readback.sha256' EXIT

            echo "Starting backup: $BACKUP_FILE"

            # Dump in PostgreSQL custom format, matching restore-database.js.
            # --env-file is required: the compose file interpolates DB_PASSWORD
            # into services.postgres.environment, and compose fails the whole
            # command on a missing variable even for `exec`.
            # Dump whatever database the container was actually initialised
            # with, not a hardcoded guess. `pg_dump -U easymod_user easymod`
            # exited 0 against an empty `easymod` database while the app's data
            # lived elsewhere — a backup of nothing that looked like a success.
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_dump --format=custom --compress=9 -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$BACKUP_TMP_FILE"

            # A pg_dump that fails mid-stream still leaves a valid gzip of a
            # partial dump, so size-check the result rather than trusting exit 0.
            # pg_restore's custom-format reader needs a seekable file, not a
            # pipe — `pg_restore -l -` fails with "could not open input file
            # "-"" even though it accepts the flag syntactically, so the dump
            # is copied into the container as a real file first.
            BACKUP_BYTES=$(wc -c < "$BACKUP_TMP_FILE")
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml exec -T postgres \
              sh -c 'cat > /tmp/backup-verify.dump' < "$BACKUP_TMP_FILE"
            TABLE_COUNT=$(docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_restore --list --exit-on-error /tmp/backup-verify.dump | grep -c "TABLE "; rm -f /tmp/backup-verify.dump')
            echo "Dump: ${BACKUP_BYTES} bytes custom format, ${TABLE_COUNT} table entries"
            if [ "$BACKUP_BYTES" -lt 10000 ] || [ "$TABLE_COUNT" -lt 5 ]; then
              echo "ERROR: dump looks empty (${BACKUP_BYTES} bytes, ${TABLE_COUNT} tables) — treating as failed"
              exit 1
            fi

            # Publish the dump only after the custom-format and table-count
            # checks pass. A failed stream must never become the newest file
            # selected by the always-run isolated restore drill.
            mv "$BACKUP_TMP_FILE" "$BACKUP_FILE"
            sha256sum "$BACKUP_FILE" > "$BACKUP_FILE.sha256"
            printf '%s\n' "$BACKUP_FILE" > "$BACKUP_DIR/backup-${BACKUP_RUN_ID}.receipt"
            echo "Backup complete: $(du -sh "$BACKUP_FILE" | cut -f1)"

            echo "Starting uploads volume backup: $BACKUP_DIR/$UPLOADS_BACKUP_FILE"
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml run \
              --rm --no-deps --user root -v "$BACKUP_DIR":/backup --entrypoint sh backend \
              -c "cd /app/uploads && tar czf /backup/$UPLOADS_BACKUP_FILE ."
            echo "Uploads backup complete: $(du -sh "$BACKUP_DIR/$UPLOADS_BACKUP_FILE" | cut -f1)"

            # Product uploads are quota-bounded at request time. Sweep
            # abandoned files after the backup so a failed product save or
            # abandoned form cannot retain storage indefinitely. Best-effort:
            # the deployed backend image can legitimately lag the repo while
            # production deploys are gated off, so a missing script here must
            # not abort the backup that this whole job exists to produce.
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml run \
              --rm --no-deps --user root --entrypoint node backend /app/scripts/cleanup-product-media.js \
              || echo "::warning::cleanup-product-media.js unavailable in the currently deployed backend image — orphan sweep skipped this run"

            # ── Off-site upload (F-04) ────────────────────────────────────────
            # Credential presence, HTTPS and bucket reachability were already
            # enforced fail-closed at the top of this script; the upload itself
            # is unconditional from here.
            echo "Off-site upload: encrypting and uploading to object storage."

              upload_one() {
                SRC="$1"; DEST_PREFIX="$2"
                BASE=$(basename "$SRC")
                ENC="$BACKUP_DIR/${BASE}.enc"

                # Client-side AES-256 encryption. The object storage never sees
                # plaintext; losing BACKUP_ENCRYPTION_KEY means the archive is
                # unrecoverable, so that secret must be preserved off-platform.
                openssl enc -aes-256-cbc -pbkdf2 -salt -in "$SRC" -out "$ENC" \
                  -pass env:BACKUP_ENCRYPTION_KEY

                # Integrity checksum uploaded alongside the object.
                sha256sum "$ENC" | awk '{print $1}' > "$ENC.sha256"

                # Use the official aws-cli container so we do not depend on the
                # host having awscli installed. DO Spaces is S3-compatible.
                docker run --rm \
                  -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                  -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                  -v "$BACKUP_DIR":/backup \
                  "$AWS_CLI_IMAGE" s3 cp "/backup/$(basename "$ENC")" \
                  "s3://$BACKUP_BUCKET/$DEST_PREFIX/$(basename "$ENC")" \
                  --endpoint-url "$SPACES_ENDPOINT"

                docker run --rm \
                  -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                  -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                  -v "$BACKUP_DIR":/backup \
                  "$AWS_CLI_IMAGE" s3 cp "/backup/$(basename "$ENC").sha256" \
                  "s3://$BACKUP_BUCKET/$DEST_PREFIX/$(basename "$ENC").sha256" \
                  --endpoint-url "$SPACES_ENDPOINT"

                  if [ "$DEST_PREFIX" = "db" ] || [ "$DEST_PREFIX" = "uploads" ]; then
                    READBACK="$BACKUP_DIR/${BASE}.readback.enc"
                    READBACK_SHA="$BACKUP_DIR/${BASE}.readback.sha256"
                    DECRYPTED="$BACKUP_DIR/${BASE}.readback.dump"
                   docker run --rm \
                     -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                     -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                     -v "$BACKUP_DIR":/backup \
                      "$AWS_CLI_IMAGE" s3 cp "s3://$BACKUP_BUCKET/$DEST_PREFIX/$(basename "$ENC")" "/backup/$(basename "$READBACK")" \
                     --endpoint-url "$SPACES_ENDPOINT"
                   docker run --rm \
                     -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                     -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                     -v "$BACKUP_DIR":/backup \
                      "$AWS_CLI_IMAGE" s3 cp "s3://$BACKUP_BUCKET/$DEST_PREFIX/$(basename "$ENC").sha256" "/backup/$(basename "$READBACK_SHA")" \
                     --endpoint-url "$SPACES_ENDPOINT"
                   expected_checksum=$(awk '{print $1}' "$READBACK_SHA")
                   actual_checksum=$(sha256sum "$READBACK" | awk '{print $1}')
                   test -n "$expected_checksum" && test "$actual_checksum" = "$expected_checksum"
                    openssl enc -d -aes-256-cbc -pbkdf2 -in "$READBACK" -out "$DECRYPTED" \
                      -pass env:BACKUP_ENCRYPTION_KEY
                    if [ "$DEST_PREFIX" = "db" ]; then
                      docker run --rm -v "$BACKUP_DIR":/backup "$POSTGRES_HELPER_IMAGE" \
                        pg_restore --list --exit-on-error "/backup/$(basename "$DECRYPTED")"
                    else
                      docker run --rm -v "$BACKUP_DIR":/backup "$POSTGRES_HELPER_IMAGE" \
                        tar -tzf "/backup/$(basename "$DECRYPTED")" >/dev/null
                    fi
                    rm -f "$READBACK" "$READBACK_SHA" "$DECRYPTED"
                    echo "REMOTE_READBACK=$DEST_PREFIX:PASS"
                  fi

                 echo "Off-site upload OK: $DEST_PREFIX/$(basename "$ENC")"
                rm -f "$ENC" "$ENC.sha256"
              }

              upload_one "$BACKUP_FILE" "db"
              upload_one "$BACKUP_DIR/$UPLOADS_BACKUP_FILE" "uploads"

              # Defense-in-depth privacy check through the S3-compat ACL view.
              # The authoritative OCI-native privacy + lifecycle audit runs in
              # the next step: OCI lifecycle policies are NOT readable through
              # the S3 API (the lifecycle GET always reports
              # NoSuchLifecycleConfiguration on OCI), so retention is proven
              # there via the restricted audit identity instead.
              BUCKET_ACL=$(docker run --rm \
                -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                "$AWS_CLI_IMAGE" s3api get-bucket-acl --bucket "$BACKUP_BUCKET" \
                --endpoint-url "$SPACES_ENDPOINT" --output json)
              if printf '%s' "$BUCKET_ACL" | grep -Eq 'AllUsers|AuthenticatedUsers'; then
                echo "::error::object-storage bucket ACL exposes a public or authenticated-users grant"
                exit 1
              fi

              echo "Off-site upload complete."

            # Retain only the last 7 days of LOCAL copies
            find "$BACKUP_DIR" -name "easymod-*.dump" -mtime +7 -delete
            find "$BACKUP_DIR" -name "easymod-uploads-*.tar.gz" -mtime +7 -delete
            find "$BACKUP_DIR" -name "*.enc" -mtime +1 -delete 2>/dev/null || true
            echo "Retention cleanup done. Current backups:"
            ls -lh "$BACKUP_DIR"

      - name: Audit bucket privacy + lifecycle retention (OCI-native)
        env:
          OCI_AUDIT_PRIVATE_KEY: ${{ secrets.OCI_AUDIT_PRIVATE_KEY }}
          OCI_AUDIT_TENANCY_OCID: ${{ vars.OCI_AUDIT_TENANCY_OCID }}
          OCI_AUDIT_USER_OCID: ${{ vars.OCI_AUDIT_USER_OCID }}
          OCI_AUDIT_FINGERPRINT: ${{ vars.OCI_AUDIT_FINGERPRINT }}
          OCI_AUDIT_NAMESPACE: ${{ vars.OCI_AUDIT_NAMESPACE }}
          OCI_AUDIT_REGION: ${{ vars.OCI_AUDIT_REGION }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          OFFSITE_RETENTION_DAYS: ${{ vars.OFFSITE_RETENTION_DAYS || '30' }}
        run: |
          set -euo pipefail

          # The retention variable alone is not evidence that the bucket will
          # actually delete expired objects, and the S3-compat API cannot read
          # OCI lifecycle policies. Prove both privacy and retention through
          # the OCI control plane with the restricted read-only audit identity
          # (group policy: `read buckets in tenancy`, nothing else).
          if [ -z "${OCI_AUDIT_PRIVATE_KEY:-}" ] || [ -z "${OCI_AUDIT_TENANCY_OCID:-}" ] \
             || [ -z "${OCI_AUDIT_USER_OCID:-}" ] || [ -z "${OCI_AUDIT_FINGERPRINT:-}" ] \
             || [ -z "${OCI_AUDIT_NAMESPACE:-}" ] || [ -z "${OCI_AUDIT_REGION:-}" ] \
             || [ -z "${BACKUP_BUCKET:-}" ]; then
            echo "::error::OCI_AUDIT_CREDENTIALS_MISSING — cannot prove bucket privacy/retention"
            echo "RECOVERY_EXECUTION_PAUSED_FOR_CREDENTIAL"
            exit 1
          fi
          if ! [[ "$OFFSITE_RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::OFFSITE_RETENTION_DAYS must be a positive integer"
            exit 1
          fi

          umask 077
          OCI_AUDIT_KEY_FILE=$(mktemp)
          trap 'rm -f "$OCI_AUDIT_KEY_FILE"' EXIT
          printf '%s\n' "$OCI_AUDIT_PRIVATE_KEY" > "$OCI_AUDIT_KEY_FILE"
          export OCI_AUDIT_KEY_FILE

          # Pinned to the SDK version bundled with the OCI CLI used to
          # provision the bucket (3.96.2).
          pip install --quiet --disable-pip-version-check 'oci==2.191.0'

          python3 - <<'PY'
          import os
          import sys

          import oci

          cfg = {
              "user": os.environ["OCI_AUDIT_USER_OCID"],
              "fingerprint": os.environ["OCI_AUDIT_FINGERPRINT"],
              "tenancy": os.environ["OCI_AUDIT_TENANCY_OCID"],
              "region": os.environ["OCI_AUDIT_REGION"],
              "key_file": os.environ["OCI_AUDIT_KEY_FILE"],
          }
          oci.config.validate_config(cfg)
          client = oci.object_storage.ObjectStorageClient(cfg)

          namespace = os.environ["OCI_AUDIT_NAMESPACE"]
          bucket_name = os.environ["BACKUP_BUCKET"]
          expected_days = int(os.environ["OFFSITE_RETENTION_DAYS"])

          bucket = client.get_bucket(namespace, bucket_name).data
          if bucket.public_access_type != "NoPublicAccess":
              print("::error::bucket public_access_type=%s is not NoPublicAccess"
                    % bucket.public_access_type)
              sys.exit(1)
          print("OFFSITE_PRIVACY_CHECK=NoPublicAccess:PASS")

          policy = client.get_object_lifecycle_policy(namespace, bucket_name).data
          covered = set()
          for item in policy.items or []:
              if item.action != "DELETE" or not item.is_enabled:
                  continue
              if item.time_amount != expected_days or (item.time_unit or "DAYS") != "DAYS":
                  continue
              prefixes = []
              if item.object_name_filter and item.object_name_filter.inclusion_prefixes:
                  prefixes = item.object_name_filter.inclusion_prefixes
              if not prefixes:
                  # An unfiltered DELETE rule covers the whole bucket.
                  covered |= {"db/", "uploads/"}
              for prefix in prefixes:
                  if prefix in ("db/", "db"):
                      covered.add("db/")
                  if prefix in ("uploads/", "uploads"):
                      covered.add("uploads/")
          missing = {"db/", "uploads/"} - covered
          if missing:
              print("::error::lifecycle policy does not enforce %d-day DELETE for %s"
                    % (expected_days, sorted(missing)))
              sys.exit(1)
          print("OFFSITE_LIFECYCLE_RETENTION=%d:PASS" % expected_days)
          PY

          echo "Off-site lifecycle retention policy verified: ${OFFSITE_RETENTION_DAYS} days"

  restore-drill:
    name: Isolated PostgreSQL restore drill
    # Nightly against the backup just taken, and on demand. Fresh-database CI
    # cannot see production schema drift, so the restored dump is the only
    # pre-production place a migration can be proved against the real schema.
    needs: [backup]
    # always(): the drill reads the newest dump on the production host, so a
    # failed off-site audit must not also cost the day's migration proof.
    if: |
      always() && github.ref == 'refs/heads/main' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.restore_drill == true)
      )
    # The drill SSHs into the production host with repository-scoped
    # credentials, so it belongs behind the same protected environment gate as
    # the backup job itself. Without this, a scheduled or manual dispatch of
    # backup.yml could reach the production host without production-environment
    # approval, contradicting the isolation claim made for the file.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Derive pinned SSH host fingerprint
        id: ssh_host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          host_entry=$(ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" | awk '!/^#/ { print; exit }')
          key_type=$(printf '%s\n' "$host_entry" | awk '{ print $2 }')
          key_blob=$(printf '%s\n' "$host_entry" | awk '{ print $3 }')
          if [ -z "$key_type" ] || [ -z "$key_blob" ]; then
            echo '::error::pinned host key is missing for DEPLOY_HOST'
            exit 1
          fi
          fingerprint=$(printf '%s %s\n' "$key_type" "$key_blob" | ssh-keygen -lf - -E sha256 | awk '{ print $2 }')
          if [ -z "$fingerprint" ]; then
            echo '::error::could not derive the pinned host fingerprint'
            exit 1
          fi
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore the recorded production dump into an isolated target
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          RESTORE_DRILL_RUN_ID: ${{ github.run_id }}
          FORWARD_MIGRATION_IMAGE: ${{ inputs.forward_migration_image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GHCR_BACKEND: ghcr.io/${{ github.repository_owner }}/easymoderator-backend
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          fingerprint: ${{ steps.ssh_host.outputs.fingerprint }}
          timeout: 900s
          command_timeout: 30m
          envs: RESTORE_DRILL_RUN_ID,FORWARD_MIGRATION_IMAGE,GH_TOKEN,GH_ACTOR,GHCR_BACKEND
          script: |
            set -euo pipefail
            umask 077

            RECEIPT="/opt/easymod/backups/backup-${RESTORE_DRILL_RUN_ID}.receipt"
            test -s "$RECEIPT"
            BACKUP_FILE=$(cat "$RECEIPT")
            test -n "$BACKUP_FILE"
            printf 'RESTORE_BACKUP_FILE=%s\n' "$BACKUP_FILE"
            RESTORE_CONTAINER="easymod-restore-drill-${RESTORE_DRILL_RUN_ID}"
            RESTORE_NETWORK="${RESTORE_CONTAINER}-network"
            RESTORE_VOLUME="${RESTORE_CONTAINER}-data"
            RESTORE_UPLOADS_VOLUME="${RESTORE_CONTAINER}-uploads"
            POSTGRES_IMAGE='postgres@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a'
            POSTGRES_HELPER_IMAGE='postgres@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a'

            cleanup() {
              docker rm -f "$RESTORE_CONTAINER" >/dev/null 2>&1 || true
              docker volume rm "$RESTORE_VOLUME" >/dev/null 2>&1 || true
              docker volume rm "$RESTORE_UPLOADS_VOLUME" >/dev/null 2>&1 || true
              docker network rm "$RESTORE_NETWORK" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            # The target must never be production or attached to its network.
            test "$RESTORE_CONTAINER" != 'easymod-postgres-1'
            test "$RESTORE_NETWORK" != 'easymod_internal'
            test -f "$BACKUP_FILE"
            test -f "$BACKUP_FILE.sha256"
            sha256sum --check "$BACKUP_FILE.sha256"
            test -n "$RESTORE_DRILL_RUN_ID"

            if docker ps -a --format '{{.Names}}' | grep -Fxq "$RESTORE_CONTAINER"; then
              echo 'RESTORE_DRILL_REFUSED=existing_container'
              exit 1
            fi
            if docker network ls --format '{{.Name}}' | grep -Fxq "$RESTORE_NETWORK"; then
              echo 'RESTORE_DRILL_REFUSED=existing_network'
              exit 1
            fi
            if docker volume ls --format '{{.Name}}' | grep -Fxq "$RESTORE_VOLUME"; then
              echo 'RESTORE_DRILL_REFUSED=existing_volume'
              exit 1
            fi

            PRODUCTION_POSTGRES_STARTED_AT=$(docker inspect -f '{{.State.StartedAt}}' easymod-postgres-1)
            POSTGRES_ENV=$(docker inspect easymod-postgres-1 --format '{{range .Config.Env}}{{println .}}{{end}}')
            POSTGRES_USER=$(printf '%s\n' "$POSTGRES_ENV" | awk -F= '$1 == "POSTGRES_USER" { print substr($0, index($0, "=") + 1); exit }')
            POSTGRES_PASSWORD=$(printf '%s\n' "$POSTGRES_ENV" | awk -F= '$1 == "POSTGRES_PASSWORD" { print substr($0, index($0, "=") + 1); exit }')
            POSTGRES_DB=$(printf '%s\n' "$POSTGRES_ENV" | awk -F= '$1 == "POSTGRES_DB" { print substr($0, index($0, "=") + 1); exit }')
            test -n "$POSTGRES_USER"
            test -n "$POSTGRES_PASSWORD"
            test -n "$POSTGRES_DB"

            docker network create "$RESTORE_NETWORK" >/dev/null
            docker volume create "$RESTORE_VOLUME" >/dev/null
            docker run --detach --name "$RESTORE_CONTAINER" \
              --network "$RESTORE_NETWORK" \
              --mount "type=volume,src=$RESTORE_VOLUME,dst=/var/lib/postgresql/data" \
              --env "POSTGRES_USER=$POSTGRES_USER" \
              --env "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
              --env "POSTGRES_DB=$POSTGRES_DB" \
              "$POSTGRES_IMAGE" >/dev/null

            ready=false
            for attempt in $(seq 1 60); do
              if docker exec "$RESTORE_CONTAINER" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 \
                && [ "$(docker exec "$RESTORE_CONTAINER" psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT 1' 2>/dev/null)" = 1 ]; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true

            docker cp "$BACKUP_FILE" "$RESTORE_CONTAINER:/tmp/restore.dump"
            docker exec "$RESTORE_CONTAINER" pg_restore \
              --clean --if-exists --exit-on-error --no-owner --no-privileges \
              -U "$POSTGRES_USER" -d "$POSTGRES_DB" /tmp/restore.dump

            # Restore and read back the product uploads archive as well as the
            # database. This keeps the DR drill from proving only relational
            # data while silently ignoring customer media.
            UPLOADS_FILE="${BACKUP_FILE%.dump}"
            UPLOADS_FILE="${UPLOADS_FILE/easymod-/easymod-uploads-}.tar.gz"
            test -f "$UPLOADS_FILE"
            docker volume create "$RESTORE_UPLOADS_VOLUME" >/dev/null
            docker run --rm \
              --mount "type=volume,src=$RESTORE_UPLOADS_VOLUME,dst=/restore" \
              --mount "type=bind,src=$UPLOADS_FILE,dst=/tmp/uploads.tar.gz,readonly" \
              "$POSTGRES_HELPER_IMAGE" sh -c \
                'tar xzf /tmp/uploads.tar.gz -C /restore'
            echo 'RESTORE_UPLOADS_ARCHIVE=PASS'

            for table in users shops growth_os_user_roles growth_os_prospects growth_os_prospect_events growth_os_followups growth_os_notes; do
              table_exists=$(docker exec "$RESTORE_CONTAINER" psql -X -At \
                -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "SELECT to_regclass('public.' || quote_ident('$table')) IS NOT NULL;")
              if [ "$table_exists" = t ]; then
                row_count=$(docker exec "$RESTORE_CONTAINER" psql -X -At \
                  -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                  -c "SELECT COUNT(*) FROM \"$table\";")
                printf 'RESTORE_ROW_COUNT_%s=%s\n' "$table" "$row_count"
                if [ "$table" = users ] || [ "$table" = shops ]; then
                  test "$row_count" -gt 0
                fi
              else
                printf 'RESTORE_ROW_COUNT_%s=ABSENT\n' "$table"
              fi
            done

            max_migration=$(docker exec "$RESTORE_CONTAINER" psql -X -At \
              -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c 'SELECT name FROM migrations ORDER BY executed_at DESC LIMIT 1;')
            test -n "$max_migration"
            printf 'RESTORE_MAX_MIGRATION=%s\n' "$max_migration"

            echo 'RESTORE_PG_RESTORE=PASS'

            # ── Forward-migration gate ──────────────────────────────────────
            # Run 32511063613 failed its production migration while CI was
            # green: CI builds a fresh squash-shaped database, production
            # carries a pre-squash shape its ledger claims is already migrated.
            # Pending migrations are therefore proved here, against the restored
            # dump, before they are ever pointed at production.
            MIGRATION_IMAGE="${FORWARD_MIGRATION_IMAGE:-}"
            if [ -z "$MIGRATION_IMAGE" ]; then
              MIGRATION_IMAGE=$(docker inspect -f '{{.Config.Image}}' easymod-backend-1)
            fi
            test -n "$MIGRATION_IMAGE"
            MIGRATION_PREFIX="${GHCR_BACKEND}@sha256:"
            if [[ "$MIGRATION_IMAGE" != "$MIGRATION_PREFIX"* ]]; then
              echo 'ERROR: forward migration image must be the immutable backend digest reference'
              exit 1
            fi
            MIGRATION_DIGEST="${MIGRATION_IMAGE#"$MIGRATION_PREFIX"}"
            if ! printf '%s' "$MIGRATION_DIGEST" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo 'ERROR: forward migration image digest is invalid'
              exit 1
            fi
            echo "FORWARD_MIGRATION_IMAGE=$MIGRATION_IMAGE"
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
            docker pull "$MIGRATION_IMAGE" >/dev/null

            migration_count() {
              docker exec "$1" psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT COUNT(*) FROM migrations;'
            }
            PRODUCTION_LEDGER_BEFORE=$(migration_count easymod-postgres-1)
            RESTORED_LEDGER_BEFORE=$(migration_count "$RESTORE_CONTAINER")

            # A throwaway hex login keeps production's own credentials out of
            # the connection string, and hex needs no URL escaping.
            DRILL_PASSWORD=$(openssl rand -hex 24)
            docker exec "$RESTORE_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE ROLE restore_drill LOGIN SUPERUSER PASSWORD '$DRILL_PASSWORD';"
            DRILL_DATABASE_URL="postgres://restore_drill:$DRILL_PASSWORD@$RESTORE_CONTAINER:5432/$POSTGRES_DB"

            # The migrator gets production's env file for its secrets, so the
            # only thing separating it from the live database is the
            # DATABASE_URL override. The container re-checks that override
            # itself and exits before the first statement unless it names this
            # drill's isolated container.
            docker run --rm --network "$RESTORE_NETWORK" --env-file /opt/easymod/.env.prod -e RUN_MIGRATIONS_ON_STARTUP=false -e DB_SSL=false -e DATABASE_URL="$DRILL_DATABASE_URL" -e EXPECTED_DB_HOST="$RESTORE_CONTAINER" "$MIGRATION_IMAGE" sh -c "node -e 'if (new URL(process.env.DATABASE_URL).hostname !== process.env.EXPECTED_DB_HOST) { console.error(process.env.EXPECTED_DB_HOST); process.exit(1); }' && node src/database/migrate.js up"

            RESTORED_LEDGER_AFTER=$(migration_count "$RESTORE_CONTAINER")
            echo "RESTORED_FORWARD_MIGRATIONS_APPLIED=$((RESTORED_LEDGER_AFTER - RESTORED_LEDGER_BEFORE))"
            echo 'RESTORED_FORWARD_MIGRATION=PASS'

            docker run --rm --network "$RESTORE_NETWORK" --env-file /opt/easymod/.env.prod -e DB_SSL=false -e DATABASE_URL="$DRILL_DATABASE_URL" "$MIGRATION_IMAGE" node scripts/schema-drift-audit.js
            echo 'RESTORED_SCHEMA_DRIFT_AUDIT=CLEAN'

            # None of the above may have touched production: same postgres
            # process, same migration ledger.
            test "$(docker inspect -f '{{.State.StartedAt}}' easymod-postgres-1)" = "$PRODUCTION_POSTGRES_STARTED_AT"
            test "$(migration_count easymod-postgres-1)" = "$PRODUCTION_LEDGER_BEFORE"
            echo 'PRODUCTION_POSTGRES_UPTIME_UNCHANGED=PASS'
            echo 'PRODUCTION_MIGRATION_LEDGER_UNCHANGED=PASS'
